apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: configure-insecure-registry
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: configure-insecure-registry
  template:
    metadata:
      labels:
        name: configure-insecure-registry
    spec:
      hostPID: true
      hostNetwork: true
      containers:
      - name: configure
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          # Create registries.yaml for k3s
          mkdir -p /host/etc/rancher/k3s
          cat > /host/etc/rancher/k3s/registries.yaml <<EOF
          mirrors:
            "10.43.170.72:5000":
              endpoint:
                - "http://10.43.170.72:5000"
          configs:
            "10.43.170.72:5000":
              tls:
                insecure_skip_verify: true
          EOF

          # Restart k3s to pick up the config
          nsenter --target 1 --mount --uts --ipc --net --pid -- systemctl restart k3s || \
          nsenter --target 1 --mount --uts --ipc --net --pid -- systemctl restart k3s-agent || true

          echo "Registry configuration applied. Sleeping..."
          sleep infinity
        securityContext:
          privileged: true
        volumeMounts:
        - name: host
          mountPath: /host
      volumes:
      - name: host
        hostPath:
          path: /
      tolerations:
      - effect: NoSchedule
        operator: Exists
