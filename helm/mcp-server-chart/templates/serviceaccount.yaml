{{- if .Values.mcpServer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.mcpServer.serviceAccount.name | default .Values.mcpServer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.mcpServer.name }}
    app.kubernetes.io/name: {{ .Values.mcpServer.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.mcpServer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
