{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name | default (printf "%s-credentials" .Values.mcpServer.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.mcpServer.name }}
    app.kubernetes.io/name: {{ .Values.mcpServer.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}
