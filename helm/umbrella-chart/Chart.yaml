apiVersion: v2
name: cortex-mcp-servers
description: Umbrella Helm chart for all Cortex MCP (Model Context Protocol) servers
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - mcp
  - cortex
  - ai
  - integration
  - wazuh
  - proxmox
  - n8n
  - kubernetes
home: https://github.com/ry-ops/cortex
maintainers:
  - name: Cortex Team
    email: cortex@example.com
dependencies:
  - name: mcp-server
    version: 1.0.0
    repository: "file://../mcp-server-chart"
    alias: wazuh
    condition: wazuh.enabled
  - name: mcp-server
    version: 1.0.0
    repository: "file://../mcp-server-chart"
    alias: proxmox
    condition: proxmox.enabled
  - name: mcp-server
    version: 1.0.0
    repository: "file://../mcp-server-chart"
    alias: n8n
    condition: n8n.enabled
  - name: mcp-server
    version: 1.0.0
    repository: "file://../mcp-server-chart"
    alias: k3s
    condition: k3s.enabled
  - name: mcp-server
    version: 1.0.0
    repository: "file://../mcp-server-chart"
    alias: talos
    condition: talos.enabled
  - name: mcp-server
    version: 1.0.0
    repository: "file://../mcp-server-chart"
    alias: opentofu
    condition: opentofu.enabled
  - name: mcp-server
    version: 1.0.0
    repository: "file://../mcp-server-chart"
    alias: ansible
    condition: ansible.enabled
  - name: mcp-server
    version: 1.0.0
    repository: "file://../mcp-server-chart"
    alias: unifi
    condition: unifi.enabled
  - name: mcp-server
    version: 1.0.0
    repository: "file://../mcp-server-chart"
    alias: cloudflare
    condition: cloudflare.enabled
