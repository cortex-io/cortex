# Cortex AI Agents - Feature Flags Configuration
#
# Control which AI agent enhancements are enabled
# Safe to toggle features on/off for gradual rollout

features:
  # Advanced Observability & Monitoring
  # Tracks agent decisions, actions, and interactions in real-time
  # Includes anomaly detection and health scoring
  observability_enabled: true

  # Align-by-Design Governance Framework
  # Validates actions against policies, ethics, and compliance
  # Includes SOC2, GDPR, HIPAA compliance checking
  governance_enabled: true

  # Autonomous Agent Execution
  # Enables agents to act without human initiation
  # Triggered by events, schedules, or thresholds
  # ⚠️ Start with false, enable after testing
  autonomous_enabled: false

  # Advanced Reasoning Patterns
  # Chain-of-Thought, ReAct, Plan-Execute reasoning
  # Enables sophisticated problem-solving for complex tasks
  advanced_reasoning_enabled: true

  # Multi-Agent Orchestration
  # Coordinates multiple agents for complex, multi-step tasks
  # Includes task decomposition and agent-to-agent communication
  multi_agent_enabled: true

  # AIQ Training & Measurement
  # Measures team AI readiness and provides personalized training
  # Tracks progress over time
  aiq_training_enabled: true

  # Consumer-Facing AI Agents
  # Public-facing agent interfaces for end users
  # ⚠️ Lower priority, requires additional security review
  consumer_agents_enabled: false

# Rollout Strategy Recommendations:
#
# Phase 1 (Week 1): Enable observability + governance only
#   - Test monitoring and validation without execution
#   - Verify governance policies are correct
#
# Phase 2 (Week 2): Enable advanced_reasoning + multi_agent
#   - Test reasoning on non-critical tasks
#   - Verify multi-agent coordination works correctly
#
# Phase 3 (Week 3): Enable aiq_training
#   - Begin team assessments and training
#   - Track AIQ improvements
#
# Phase 4 (Week 4+): Gradually enable autonomous_enabled
#   - Start with low-risk autonomous actions only
#   - Monitor closely for 1 week before expanding
#
# Phase 5 (Future): Enable consumer_agents_enabled
#   - Requires additional security review
#   - Implement rate limiting and abuse prevention
#   - Begin with limited beta users

# Safety Notes:
# - All features have rollback capability
# - Governance validates all actions regardless of feature flags
# - Observability tracks all agent behavior for audit
# - Feature flags can be changed without code deployment
