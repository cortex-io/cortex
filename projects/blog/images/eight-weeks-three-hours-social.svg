<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Social sharing image for observability pipeline post -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00ffcc;stop-opacity:0.6" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="white" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="1"/>
    <line x1="0" y1="472" x2="1200" y2="472" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Clock/speed visualization -->
  <g transform="translate(600, 315)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#00d9ff" stroke-width="3" opacity="0.4" stroke-dasharray="12,8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
    </circle>

    <!-- Middle ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#00ffcc" stroke-width="2" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="15s" repeatCount="indefinite"/>
    </circle>

    <!-- Center circle -->
    <circle cx="0" cy="0" r="80" fill="#16213e" opacity="0.9"/>

    <!-- Clock hands showing speed -->
    <g filter="url(#glow)">
      <!-- Fast moving hand -->
      <line x1="0" y1="0" x2="0" y2="-50" stroke="#00d9ff" stroke-width="4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      </line>

      <!-- Slower moving hand -->
      <line x1="0" y1="0" x2="0" y2="-35" stroke="#00ffcc" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </line>

      <!-- Center dot -->
      <circle cx="0" cy="0" r="8" fill="#00d9ff">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Speed indicators around the circle -->
    <g opacity="0.6">
      <circle cx="0" cy="-140" r="6" fill="#00d9ff">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="99" cy="-99" r="6" fill="#00ffcc">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
      </circle>
      <circle cx="140" cy="0" r="6" fill="#00d9ff">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
      </circle>
      <circle cx="99" cy="99" r="6" fill="#00ffcc">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <circle cx="0" cy="140" r="6" fill="#00d9ff">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
      </circle>
      <circle cx="-99" cy="99" r="6" fill="#00ffcc">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="-140" cy="0" r="6" fill="#00d9ff">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
      <circle cx="-99" cy="-99" r="6" fill="#00ffcc">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="1.4s"/>
      </circle>
    </g>
  </g>

  <!-- Pipeline stages (simplified) -->
  <g transform="translate(150, 150)" opacity="0.7">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#16213e" stroke="#00d9ff" stroke-width="2"/>
    <circle cx="50" cy="30" r="15" fill="#00d9ff" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(150, 420)" opacity="0.7">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#16213e" stroke="#00ffcc" stroke-width="2"/>
    <circle cx="50" cy="30" r="15" fill="#00ffcc" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>

  <g transform="translate(950, 150)" opacity="0.7">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#16213e" stroke="#00d9ff" stroke-width="2"/>
    <circle cx="50" cy="30" r="15" fill="#00d9ff" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>

  <g transform="translate(950, 420)" opacity="0.7">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#16213e" stroke="#00ffcc" stroke-width="2"/>
    <circle cx="50" cy="30" r="15" fill="#00ffcc" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- Floating speed indicators -->
  <g opacity="0.3">
    <text x="200" y="100" fill="#00d9ff" font-size="24" font-weight="bold">80x</text>
    <text x="950" y="550" fill="#00ffcc" font-size="24" font-weight="bold">100x</text>
  </g>

  <!-- Data flow particles -->
  <g opacity="0.4">
    <circle cx="300" cy="200" r="4" fill="#00d9ff">
      <animate attributeName="cx" values="300;900;300" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="450" r="4" fill="#00ffcc">
      <animate attributeName="cx" values="900;300;900" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner indicators -->
  <g opacity="0.5">
    <circle cx="60" cy="60" r="25" fill="none" stroke="#00d9ff" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="570" r="25" fill="none" stroke="#00ffcc" stroke-width="2" stroke-dasharray="8,4">
      <animateTransform attributeName="transform" type="rotate" from="360 1140 570" to="0 1140 570" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
