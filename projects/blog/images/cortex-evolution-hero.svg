<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  <defs>
    <!-- Gradient Definitions -->
    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="beforeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pulse Animation -->
    <radialGradient id="pulseGradient">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Title -->
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">
    Cortex Evolution: 71% → 91%
  </text>

  <!-- Subtitle -->
  <text x="600" y="100" font-family="Arial, sans-serif" font-size="20" fill="#e0e7ff" text-anchor="middle">
    Teaching AI to Learn From Feedback
  </text>

  <!-- BEFORE Section -->
  <g id="before-section">
    <text x="300" y="160" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">
      BEFORE
    </text>

    <!-- Progress Bar Before -->
    <rect x="150" y="180" width="300" height="30" rx="15" fill="#1e293b" opacity="0.5"/>
    <rect x="150" y="180" width="213" height="30" rx="15" fill="url(#beforeGradient)">
      <animate attributeName="width" from="0" to="213" dur="2s" begin="0s" fill="freeze"/>
    </rect>
    <text x="300" y="203" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      71%
    </text>

    <!-- Component Boxes Before -->
    <g transform="translate(150, 240)">
      <!-- Sensing -->
      <rect x="0" y="0" width="130" height="60" rx="8" fill="#475569" opacity="0.8"/>
      <text x="65" y="25" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">📡 Sensing</text>
      <text x="65" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fbbf24" text-anchor="middle">65%</text>

      <!-- Thinking -->
      <rect x="0" y="70" width="130" height="60" rx="8" fill="#475569" opacity="0.8"/>
      <text x="65" y="95" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">🧠 Thinking</text>
      <text x="65" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4ade80" text-anchor="middle">85%</text>

      <!-- Acting -->
      <rect x="140" y="0" width="130" height="60" rx="8" fill="#475569" opacity="0.8"/>
      <text x="205" y="25" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">⚡ Acting</text>
      <text x="205" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4ade80" text-anchor="middle">90%</text>

      <!-- Feedback - CRITICAL GAP -->
      <rect x="140" y="70" width="130" height="60" rx="8" fill="#dc2626" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="205" y="95" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">🔄 Feedback</text>
      <text x="205" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fef3c7" text-anchor="middle">45%</text>

      <!-- Critical Gap Label -->
      <text x="135" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fca5a5" text-anchor="middle">
        ⚠️ CRITICAL GAP
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Arrow -->
  <g id="arrow" transform="translate(600, 340)">
    <path d="M -40 0 L 20 0 L 20 -15 L 40 0 L 20 15 L 20 0" fill="#fbbf24" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,0; 0,0" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- AFTER Section -->
  <g id="after-section">
    <text x="900" y="160" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">
      AFTER
    </text>

    <!-- Progress Bar After -->
    <rect x="750" y="180" width="300" height="30" rx="15" fill="#1e293b" opacity="0.5"/>
    <rect x="750" y="180" width="273" height="30" rx="15" fill="url(#progressGradient)">
      <animate attributeName="width" from="213" to="273" dur="2s" begin="0s" fill="freeze"/>
    </rect>
    <text x="900" y="203" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      91%
    </text>

    <!-- Component Boxes After -->
    <g transform="translate(750, 240)">
      <!-- Sensing -->
      <rect x="0" y="0" width="130" height="60" rx="8" fill="#059669" opacity="0.9"/>
      <text x="65" y="25" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">📡 Sensing</text>
      <text x="65" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#d1fae5" text-anchor="middle">85%</text>
      <text x="65" y="58" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">+20%</text>

      <!-- Thinking -->
      <rect x="0" y="70" width="130" height="60" rx="8" fill="#059669" opacity="0.9"/>
      <text x="65" y="95" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">🧠 Thinking</text>
      <text x="65" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#d1fae5" text-anchor="middle">90%</text>
      <text x="65" y="128" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">+5%</text>

      <!-- Acting -->
      <rect x="140" y="0" width="130" height="60" rx="8" fill="#059669" opacity="0.9"/>
      <text x="205" y="25" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">⚡ Acting</text>
      <text x="205" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#d1fae5" text-anchor="middle">95%</text>
      <text x="205" y="58" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">+5%</text>

      <!-- Feedback - FIXED! -->
      <rect x="140" y="70" width="130" height="60" rx="8" fill="#10b981" opacity="0.95" filter="url(#glow)">
        <animate attributeName="opacity" values="0.95;1;0.95" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="205" y="95" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">🔄 Feedback</text>
      <text x="205" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#d1fae5" text-anchor="middle">95%</text>
      <text x="205" y="128" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">+50%</text>

      <!-- Fixed Label -->
      <text x="135" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#86efac" text-anchor="middle">
        ✅ GAP CLOSED
        <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- New Features Banner -->
  <g id="features-banner" transform="translate(0, 480)">
    <rect x="50" y="0" width="1100" height="100" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="#4ade80" stroke-width="2"/>

    <!-- Feature 1 -->
    <g transform="translate(100, 25)">
      <circle cx="0" cy="15" r="20" fill="#10b981" opacity="0.3">
        <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="10" font-size="24" text-anchor="middle">👍</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">RLHF Feedback</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">"How did I do?"</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(380, 25)">
      <circle cx="0" cy="15" r="20" fill="#10b981" opacity="0.3">
        <animate attributeName="r" values="20;25;20" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="10" font-size="24" text-anchor="middle">🤔</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Self-Evaluation</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">"Am I confident?"</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(660, 25)">
      <circle cx="0" cy="15" r="20" fill="#10b981" opacity="0.3">
        <animate attributeName="r" values="20;25;20" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="10" font-size="24" text-anchor="middle">🔍</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Proactive Scan</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Daily automation</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(940, 25)">
      <circle cx="0" cy="15" r="20" fill="#10b981" opacity="0.3">
        <animate attributeName="r" values="20;25;20" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="10" font-size="24" text-anchor="middle">🚀</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Self-Optimize</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">16 tasks active</text>
    </g>
  </g>

  <!-- Sparkles for celebration -->
  <g id="sparkles">
    <circle cx="520" cy="150" r="3" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="140" r="3" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="130" r="3" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
