<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace Viewer - Commit-Relay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/trace-waterfall.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <a href="/" class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                            <i data-lucide="git-commit" class="w-5 h-5 text-white"></i>
                        </div>
                        <h1 class="text-xl font-bold text-gray-900 dark:text-white">Trace Viewer</h1>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <nav class="hidden md:flex items-center space-x-2">
                        <a href="/" class="px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 text-sm">Dashboard</a>
                        <a href="/admin.html" class="px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 text-sm">Admin</a>
                        <a href="/compliance.html" class="px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 text-sm">Compliance</a>
                    </nav>
                    <button onclick="fetchTraces()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="Refresh">
                        <i data-lucide="refresh-cw" class="w-5 h-5 text-gray-600 dark:text-gray-400"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Search and Filters -->
        <div class="mb-6 bg-white dark:bg-gray-800 rounded-xl shadow-lg p-4 border border-gray-200 dark:border-gray-700">
            <div class="flex flex-wrap gap-4">
                <div class="flex-1 min-w-48">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Search</label>
                    <input type="text" id="search" placeholder="Task ID, trace ID..."
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                           onchange="fetchTraces()">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
                    <select id="status" class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white" onchange="fetchTraces()">
                        <option value="">All</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                        <option value="error">Error</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Limit</label>
                    <select id="limit" class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white" onchange="fetchTraces()">
                        <option value="20">20</option>
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Trace List -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white flex items-center">
                    <i data-lucide="activity" class="w-5 h-5 mr-2 text-blue-500"></i>
                    Recent Traces
                    <span id="trace-count" class="ml-2 text-sm font-normal text-gray-500"></span>
                </h2>
            </div>
            <div id="traces-container" class="divide-y divide-gray-200 dark:divide-gray-700">
                <div class="p-8 text-center text-gray-500">
                    <i data-lucide="loader" class="w-8 h-8 mx-auto mb-2 animate-spin"></i>
                    <p>Loading traces...</p>
                </div>
            </div>
        </div>

        <!-- Trace Detail Modal -->
        <div id="trace-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden">
                <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Trace Details</h3>
                    <button onclick="closeTraceModal()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                        <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                    </button>
                </div>
                <div id="trace-detail" class="p-4 overflow-y-auto max-h-[calc(90vh-80px)]">
                    <!-- Trace waterfall will be rendered here -->
                </div>
            </div>
        </div>
    </main>

    <script src="/js/trace-visualization.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        async function fetchTraces() {
            const search = document.getElementById('search').value;
            const status = document.getElementById('status').value;
            const limit = document.getElementById('limit').value;

            const params = new URLSearchParams();
            if (search) params.append('task_id', search);
            if (status) params.append('status', status);
            params.append('limit', limit);

            try {
                const response = await fetch(`/api/traces?${params}`);
                const data = await response.json();
                renderTraces(data.traces || []);
                document.getElementById('trace-count').textContent = `(${data.traces?.length || 0} traces)`;
            } catch (error) {
                console.error('Error fetching traces:', error);
                document.getElementById('traces-container').innerHTML = `
                    <div class="p-8 text-center text-red-500">
                        <i data-lucide="alert-circle" class="w-8 h-8 mx-auto mb-2"></i>
                        <p>Error loading traces</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function renderTraces(traces) {
            const container = document.getElementById('traces-container');

            if (!traces || traces.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-gray-500">
                        <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2"></i>
                        <p>No traces found</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = traces.map(trace => `
                <div class="p-4 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition-colors" onclick="showTraceDetail('${trace.trace_id}')">
                    <div class="flex items-start justify-between mb-2">
                        <div>
                            <p class="font-mono text-sm text-gray-900 dark:text-white">${trace.trace_id || 'Unknown'}</p>
                            <p class="text-xs text-gray-500 mt-1">${trace.name || 'Unnamed trace'}</p>
                        </div>
                        <span class="px-2 py-1 rounded text-xs font-semibold ${getStatusClass(trace.status)}">
                            ${trace.status || 'unknown'}
                        </span>
                    </div>
                    <div class="flex items-center space-x-4 text-xs text-gray-500">
                        <span><i data-lucide="layers" class="w-3 h-3 inline mr-1"></i>${trace.span_count || 0} spans</span>
                        <span><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i>${trace.duration_ms || 0}ms</span>
                        <span>${formatDate(trace.started_at)}</span>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function getStatusClass(status) {
            switch (status) {
                case 'completed':
                case 'ok':
                    return 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300';
                case 'error':
                    return 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300';
                case 'active':
                    return 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300';
                default:
                    return 'bg-gray-100 dark:bg-gray-900/30 text-gray-700 dark:text-gray-300';
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Unknown';
            const date = new Date(dateStr);
            return date.toLocaleString();
        }

        async function showTraceDetail(traceId) {
            const modal = document.getElementById('trace-modal');
            const detail = document.getElementById('trace-detail');

            modal.classList.remove('hidden');
            detail.innerHTML = '<div class="text-center py-8"><i data-lucide="loader" class="w-8 h-8 mx-auto animate-spin text-gray-400"></i></div>';
            lucide.createIcons();

            try {
                const response = await fetch(`/api/traces/${traceId}`);
                const trace = await response.json();

                if (typeof renderTraceWaterfall === 'function') {
                    detail.innerHTML = '';
                    renderTraceWaterfall(detail, trace);
                } else {
                    detail.innerHTML = `<pre class="text-xs overflow-auto bg-gray-100 dark:bg-gray-900 p-4 rounded">${JSON.stringify(trace, null, 2)}</pre>`;
                }
            } catch (error) {
                detail.innerHTML = `<p class="text-red-500">Error loading trace: ${error.message}</p>`;
            }
        }

        function closeTraceModal() {
            document.getElementById('trace-modal').classList.add('hidden');
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeTraceModal();
        });

        // Initial load
        fetchTraces();
    </script>
</body>
</html>
