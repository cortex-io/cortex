<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traces - Commit-Relay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/trace-waterfall.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors" x-data="traceViewer()" x-init="init()">
    <!-- Mobile menu button -->
    <button @click="mobileMenuOpen = !mobileMenuOpen" class="fixed top-4 left-4 z-50 lg:hidden p-2 rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-lg">
        <i data-lucide="menu" class="w-6 h-6 text-gray-700 dark:text-gray-300"></i>
    </button>

    <!-- Mobile menu overlay -->
    <div x-show="mobileMenuOpen" @click="mobileMenuOpen = false" class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden" x-cloak></div>

    <!-- Sidebar -->
    <aside class="fixed top-0 left-0 h-screen w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 shadow-lg z-40 transform transition-transform duration-300 flex flex-col" :class="mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'">
        <!-- Logo -->
        <div class="flex-shrink-0 p-4 border-b border-gray-200 dark:border-gray-700">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="git-commit" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900 dark:text-white">Traces</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Distributed Tracing</p>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto px-4 py-4 space-y-1">
            <div class="pt-2 pb-1 px-4">
                <p class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Pages</p>
            </div>
            <a href="/" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300">
                <i data-lucide="gauge" class="w-5 h-5"></i>
                <span>Dashboard</span>
            </a>
            <a href="/admin.html" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300">
                <i data-lucide="sliders" class="w-5 h-5"></i>
                <span>Admin</span>
            </a>
            <a href="/compliance.html" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300">
                <i data-lucide="shield-check" class="w-5 h-5"></i>
                <span>Compliance</span>
            </a>
            <a href="/traces.html" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors bg-primary-50 dark:bg-primary-900/20 text-primary-700 dark:text-primary-300">
                <i data-lucide="git-commit" class="w-5 h-5"></i>
                <span class="font-medium">Traces</span>
            </a>
        </nav>

        <!-- Theme toggle -->
        <div class="flex-shrink-0 p-4 border-t border-gray-200 dark:border-gray-700">
            <button @click="toggleTheme()" class="w-full flex items-center justify-center space-x-2 px-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 transition-colors">
                <i x-show="!darkMode" data-lucide="moon" class="w-5 h-5"></i>
                <i x-show="darkMode" data-lucide="sun" class="w-5 h-5"></i>
                <span x-text="darkMode ? 'Light Mode' : 'Dark Mode'"></span>
            </button>
        </div>
    </aside>

    <!-- Main content -->
    <main class="lg:ml-64 min-h-screen p-4 sm:p-6 lg:p-8">
        <!-- Header -->
        <div class="mb-6 sm:mb-8">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">Trace Viewer</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-1">View distributed traces and span hierarchies</p>
        </div>

        <!-- Search and Filters -->
        <div class="mb-6 bg-white dark:bg-gray-800 rounded-xl shadow-lg p-4 sm:p-6 border border-gray-200 dark:border-gray-700">
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Search</label>
                    <input type="text" x-model="searchQuery" @input.debounce.300ms="fetchTraces()" placeholder="Task ID, trace ID..."
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                </div>
                <div class="sm:w-40">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
                    <select x-model="statusFilter" @change="fetchTraces()" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        <option value="">All</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                        <option value="error">Error</option>
                    </select>
                </div>
                <div class="sm:w-32">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Limit</label>
                    <select x-model="limit" @change="fetchTraces()" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
                <div class="sm:w-auto sm:self-end">
                    <button @click="fetchTraces()" class="w-full sm:w-auto px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                        <i data-lucide="refresh-cw" class="w-4 h-4 inline" :class="loading && 'animate-spin'"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Trace List -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
            <div class="p-4 sm:p-6 border-b border-gray-200 dark:border-gray-700">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white flex items-center">
                    <i data-lucide="activity" class="w-5 h-5 mr-2 text-primary-500"></i>
                    Recent Traces
                    <span class="ml-2 text-sm font-normal text-gray-500" x-text="'(' + traces.length + ' traces)'"></span>
                </h2>
            </div>
            <div class="divide-y divide-gray-200 dark:divide-gray-700">
                <!-- Loading state -->
                <div x-show="loading && traces.length === 0" class="p-8 text-center text-gray-500">
                    <i data-lucide="loader" class="w-8 h-8 mx-auto mb-2 animate-spin"></i>
                    <p>Loading traces...</p>
                </div>

                <!-- Empty state -->
                <div x-show="!loading && traces.length === 0" class="p-8 text-center text-gray-500">
                    <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2"></i>
                    <p>No traces found</p>
                </div>

                <!-- Trace items -->
                <template x-for="trace in traces" :key="trace.trace_id">
                    <div @click="showTraceDetail(trace.trace_id)" class="p-4 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition-colors">
                        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2 mb-2">
                            <div class="flex-1 min-w-0">
                                <p class="font-mono text-sm text-gray-900 dark:text-white truncate" x-text="trace.trace_id || 'Unknown'"></p>
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 truncate" x-text="trace.name || 'Unnamed trace'"></p>
                            </div>
                            <span class="inline-flex self-start px-2 py-1 rounded text-xs font-semibold"
                                  :class="getStatusClass(trace.status)"
                                  x-text="trace.status || 'unknown'"></span>
                        </div>
                        <div class="flex flex-wrap items-center gap-3 sm:gap-4 text-xs text-gray-500 dark:text-gray-400">
                            <span><i data-lucide="layers" class="w-3 h-3 inline mr-1"></i><span x-text="trace.span_count || 0"></span> spans</span>
                            <span><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i><span x-text="trace.duration_ms || 0"></span>ms</span>
                            <span x-text="formatDate(trace.started_at)"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <!-- Trace Detail Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4" @click.self="showModal = false" @keydown.escape.window="showModal = false">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Trace Details</h3>
                <button @click="showModal = false" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto max-h-[calc(90vh-80px)]" id="trace-detail">
                <div x-show="modalLoading" class="text-center py-8">
                    <i data-lucide="loader" class="w-8 h-8 mx-auto animate-spin text-gray-400"></i>
                </div>
                <div x-show="!modalLoading" x-html="traceDetailHtml"></div>
            </div>
        </div>
    </div>

    <script src="/js/trace-visualization.js"></script>
    <script>
        function traceViewer() {
            return {
                darkMode: true,
                mobileMenuOpen: false,
                loading: false,
                traces: [],
                searchQuery: '',
                statusFilter: '',
                limit: '50',
                showModal: false,
                modalLoading: false,
                traceDetailHtml: '',

                init() {
                    if (localStorage.getItem('theme') === 'light') {
                        this.darkMode = false;
                        document.documentElement.classList.remove('dark');
                    }
                    this.fetchTraces();
                    lucide.createIcons();
                },

                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    document.documentElement.classList.toggle('dark');
                    localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');
                },

                async fetchTraces() {
                    this.loading = true;
                    const params = new URLSearchParams();
                    if (this.searchQuery) params.append('task_id', this.searchQuery);
                    if (this.statusFilter) params.append('status', this.statusFilter);
                    params.append('limit', this.limit);

                    try {
                        const response = await fetch(`/api/traces?${params}`);
                        const data = await response.json();
                        this.traces = data.traces || [];
                    } catch (error) {
                        console.error('Error fetching traces:', error);
                        this.traces = [];
                    } finally {
                        this.loading = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                getStatusClass(status) {
                    switch (status) {
                        case 'completed':
                        case 'ok':
                            return 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300';
                        case 'error':
                            return 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300';
                        case 'active':
                            return 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300';
                        default:
                            return 'bg-gray-100 dark:bg-gray-900/30 text-gray-700 dark:text-gray-300';
                    }
                },

                formatDate(dateStr) {
                    if (!dateStr) return 'Unknown';
                    return new Date(dateStr).toLocaleString();
                },

                async showTraceDetail(traceId) {
                    this.showModal = true;
                    this.modalLoading = true;
                    this.traceDetailHtml = '';

                    try {
                        const response = await fetch(`/api/traces/${traceId}`);
                        const trace = await response.json();

                        if (typeof renderTraceWaterfall === 'function') {
                            const container = document.createElement('div');
                            renderTraceWaterfall(container, trace);
                            this.traceDetailHtml = container.innerHTML;
                        } else {
                            this.traceDetailHtml = `<pre class="text-xs overflow-auto bg-gray-100 dark:bg-gray-900 p-4 rounded">${JSON.stringify(trace, null, 2)}</pre>`;
                        }
                    } catch (error) {
                        this.traceDetailHtml = `<p class="text-red-500">Error loading trace: ${error.message}</p>`;
                    } finally {
                        this.modalLoading = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                }
            };
        }
    </script>
</body>
</html>
