version: '3.8'

services:
  k3s-mcp-server:
    build:
      context: .
      dockerfile: k3s.Dockerfile
    container_name: k3s-mcp-server
    image: ghcr.io/ry-ops/cortex/k3s-mcp-server:latest
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - K3S_API_URL=${K3S_API_URL:-https://10.88.145.180:6443}
      - K3S_KUBECONFIG=${K3S_KUBECONFIG:-/root/.kube/config}
      - PORT=${PORT:-3001}
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      # Mount kubeconfig from host
      - ${HOME}/.kube:/home/mcp/.kube:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - cortex-network
    labels:
      - "com.cortex.service=k3s-mcp-server"
      - "com.cortex.component=mcp"
      - "com.cortex.description=K3s Kubernetes Cluster MCP Server for resource management"

networks:
  cortex-network:
    driver: bridge
