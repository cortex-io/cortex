version: '3.8'

services:
  wazuh-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wazuh-mcp-server
    image: ghcr.io/ry-ops/cortex/wazuh-mcp-server:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WAZUH_API_URL=${WAZUH_API_URL:-https://10.88.140.202}
      - WAZUH_API_USER=${WAZUH_API_USER:-admin}
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD}
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - cortex-network
    labels:
      - "com.cortex.service=wazuh-mcp-server"
      - "com.cortex.component=mcp"
      - "com.cortex.description=Wazuh SIEM MCP Server for security monitoring"

networks:
  cortex-network:
    driver: bridge
