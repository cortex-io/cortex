apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-config
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: configuration
data:
  # Application Configuration
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  DASHBOARD_PORT: "3001"

  # Cortex Configuration
  CORTEX_HOME: "/app"
  COORDINATION_DIR: "/app/coordination"

  # Feature Flags
  ENABLE_MCP_SERVERS: "true"
  ENABLE_LEARNING: "true"
  ENABLE_TRACING: "true"
  ENABLE_METRICS: "true"

  # System Settings
  MAX_WORKERS: "10"
  WORKER_TIMEOUT: "300"
  TOKEN_BUDGET: "200000"

  # Dashboard Settings
  DASHBOARD_REFRESH_INTERVAL: "30"
  DASHBOARD_MAX_EVENTS: "1000"
