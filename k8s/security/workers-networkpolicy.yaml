---
# Network Policy for Cortex Workers
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cortex-workers-netpol
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: network-security
  annotations:
    description: "Allow workers to fetch tasks from masters and access external APIs"
    security.policy: "worker-isolation"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow from masters only (for health checks)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: master
      ports:
        - protocol: TCP
          port: 8080

    # Allow from coordinator
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cortex-coordinator
      ports:
        - protocol: TCP
          port: 8080

    # Allow Prometheus scraping
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090

  egress:
    # Allow to masters (task fetching, result reporting)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: master
      ports:
        - protocol: TCP
          port: 8080

    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

    # Allow to Kubernetes API server
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              component: apiserver
      ports:
        - protocol: TCP
          port: 6443

    # Allow HTTPS to external APIs (Anthropic, GitHub, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80  # Allow HTTP (upgrades to HTTPS)

    # Allow container registry access for image pulls
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5000  # Docker registry
