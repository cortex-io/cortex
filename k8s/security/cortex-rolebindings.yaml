---
# RoleBinding for Cortex Masters
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cortex-master-rolebinding
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: rbac
  annotations:
    description: "Binds cortex-master-sa to cortex-master-role"
subjects:
  - kind: ServiceAccount
    name: cortex-master-sa
    namespace: cortex
roleRef:
  kind: Role
  name: cortex-master-role
  apiGroup: rbac.authorization.k8s.io

