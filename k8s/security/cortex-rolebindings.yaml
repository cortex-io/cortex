---
# ClusterRoleBinding for Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cortex-prometheus-scraper-binding
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
  annotations:
    description: "Binds cortex-prometheus-sa to cortex-prometheus-scraper ClusterRole"
subjects:
  - kind: ServiceAccount
    name: cortex-prometheus-sa
    namespace: cortex
roleRef:
  kind: ClusterRole
  name: cortex-prometheus-scraper
  apiGroup: rbac.authorization.k8s.io
