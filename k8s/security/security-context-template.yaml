---
# Security Context Template for Cortex Pods
# This template should be applied to all Cortex Deployments and StatefulSets
#
# Usage: Copy the securityContext blocks into your pod specs

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault
  # Drop all capabilities at pod level
  supplementalGroups: []

# Container-level security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Volume mounts for read-only root filesystem
# Add these to containers using readOnlyRootFilesystem
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /home/cortex/.cache

volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}

---
# Example Deployment with Security Context Applied
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-secure-deployment
  namespace: cortex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      serviceAccountName: cortex-worker-sa

      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: cortex-container
        image: ghcr.io/ry-ops/cortex-docker:latest

        # Container-level security context
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault

        # Volume mounts for writable directories
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: cache
            mountPath: /home/cortex/.cache
          - name: work
            mountPath: /home/cortex/work

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: work
          emptyDir: {}
