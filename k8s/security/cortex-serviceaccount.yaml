---
# ServiceAccount for Cortex Master pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortex-master-sa
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: master
    app.kubernetes.io/part-of: cortex-automation
  annotations:
    description: "ServiceAccount for Cortex master pods with elevated coordination permissions"
automountServiceAccountToken: true

---
# ServiceAccount for Cortex Worker pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortex-worker-sa
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: cortex-automation
  annotations:
    description: "ServiceAccount for Cortex worker pods with read-only access"
automountServiceAccountToken: true

---
# ServiceAccount for Cortex Coordinator (special permissions)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortex-coordinator-sa
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/part-of: cortex-automation
  annotations:
    description: "ServiceAccount for Cortex coordinator with full resource management"
automountServiceAccountToken: true

---
# ServiceAccount for Prometheus monitoring
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortex-prometheus-sa
  namespace: cortex
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: cortex-automation
  annotations:
    description: "ServiceAccount for Prometheus to scrape Cortex metrics"
automountServiceAccountToken: true
