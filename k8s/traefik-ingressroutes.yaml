---
# Traefik IngressRoutes for Cortex Services
# These expose services via Traefik on 10.88.140.164
# Add to /etc/hosts:
# 10.88.140.164 cortex.cortex.local dashboard.cortex.local coordinator.cortex.local security.cortex.local development.cortex.local cicd.cortex.local

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cortex-dashboard
  namespace: cortex-system
  labels:
    app: cortex
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`dashboard.cortex.local`) || Host(`cortex.cortex.local`)
    kind: Rule
    services:
    - name: cortex-dashboard
      port: 80

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: coordinator-master
  namespace: cortex-system
  labels:
    app: cortex
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`coordinator.cortex.local`)
    kind: Rule
    services:
    - name: coordinator-master
      port: 8080

