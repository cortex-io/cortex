---
# Canary Deployment with Istio VirtualService
# This is optional - only use if you have a service mesh installed

# Stable and Canary Services
apiVersion: v1
kind: Service
metadata:
  name: cortex-coordinator-stable
  namespace: cortex
  labels:
    app: cortex
    component: coordinator
    version: stable
spec:
  type: ClusterIP
  selector:
    app: cortex
    component: coordinator
    version: stable
  ports:
  - name: http
    port: 8080
    targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: cortex-coordinator-canary
  namespace: cortex
  labels:
    app: cortex
    component: coordinator
    version: canary
spec:
  type: ClusterIP
  selector:
    app: cortex
    component: coordinator
    version: canary
  ports:
  - name: http
    port: 8080
    targetPort: 8080

---
# Istio VirtualService for traffic splitting
# Adjust weight values to control canary traffic percentage
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cortex-coordinator-canary
  namespace: cortex
spec:
  hosts:
  - cortex-coordinator
  http:
  - match:
    - headers:
        canary:
          exact: "true"
    route:
    - destination:
        host: cortex-coordinator-canary
        port:
          number: 8080
      weight: 100
  - route:
    - destination:
        host: cortex-coordinator-stable
        port:
          number: 8080
      weight: 90  # 90% stable traffic
    - destination:
        host: cortex-coordinator-canary
        port:
          number: 8080
      weight: 10  # 10% canary traffic

---
# DestinationRule for circuit breaking and load balancing
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: cortex-coordinator-canary
  namespace: cortex
spec:
  host: cortex-coordinator
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
  - name: stable
    labels:
      version: stable
  - name: canary
    labels:
      version: canary
