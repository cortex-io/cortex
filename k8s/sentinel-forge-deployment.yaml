---
# ConfigMap: Nginx configuration for dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: purple-team-nginx-config
  namespace: sentinel-forge
data:
  default.conf: |
    server {
        listen 80;
        server_name purple.cortex.local sentinel-forge.cortex.local;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Proxy to Sentinel Forge API
        location /api/ {
            proxy_pass http://sentinel-forge-api:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
        }
    }

---
# Secrets (will need to be created with actual values)
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-forge-secrets
  namespace: sentinel-forge
type: Opaque
stringData:
  wazuh-indexer-password: "SecurePassword123!"
  wazuh-api-password: "WazuhAPI123!"
  wazuh-api-token: "generated-after-deployment"
  n8n-password: "N8nAdmin123!"
  n8n-encryption-key: "randomly-generated-32-char-key-here"
