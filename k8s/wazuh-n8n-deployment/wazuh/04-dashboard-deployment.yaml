apiVersion: v1
kind: Service
metadata:
  name: wazuh-dashboard
  namespace: wazuh
  labels:
    app: wazuh-dashboard
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 5601
    targetPort: 5601
    protocol: TCP
  selector:
    app: wazuh-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  namespace: wazuh
  labels:
    app: wazuh-dashboard
    app.cortex.ai/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-dashboard
  template:
    metadata:
      labels:
        app: wazuh-dashboard
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker1
      containers:
      - name: dashboard
        image: wazuh/wazuh-dashboard:4.7.1
        env:
        - name: INDEXER_URL
          value: "https://wazuh-indexer:9200"
        - name: WAZUH_API_URL
          value: "https://wazuh-manager:55000"
        - name: API_USERNAME
          valueFrom:
            secretKeyRef:
              name: wazuh-credentials
              key: wazuh-api-user
        - name: API_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-credentials
              key: wazuh-api-password
        - name: DASHBOARD_USERNAME
          valueFrom:
            secretKeyRef:
              name: wazuh-credentials
              key: dashboard-user
        - name: DASHBOARD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-credentials
              key: dashboard-password
        - name: SERVER_SSL_ENABLED
          value: "false"
        - name: WAZUH_API_SSL_VERIFY
          value: "false"
        ports:
        - containerPort: 5601
          name: http
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /status
            port: 5601
          initialDelaySeconds: 90
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /status
            port: 5601
          initialDelaySeconds: 60
          periodSeconds: 10
