apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-mcp-config
  namespace: mcp
data:
  WAZUH_API_URL: "http://wazuh-manager.wazuh.svc.cluster.local:55000"
  PORT: "3000"
---
apiVersion: v1
kind: Secret
metadata:
  name: wazuh-mcp-credentials
  namespace: mcp
type: Opaque
stringData:
  WAZUH_API_USER: "wazuh-api"
  WAZUH_API_PASSWORD: "MyS3cr3tP@ssw0rd!"
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-mcp-server
  namespace: mcp
  labels:
    app: wazuh-mcp-server
    app.cortex.ai/component: mcp-server
    app.cortex.ai/type: wazuh
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: wazuh-mcp-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-mcp-server
  namespace: mcp
  labels:
    app: wazuh-mcp-server
    app.cortex.ai/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-mcp-server
  template:
    metadata:
      labels:
        app: wazuh-mcp-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker2
      containers:
      - name: wazuh-mcp
        image: wazuh-mcp-server:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: wazuh-mcp-config
        - secretRef:
            name: wazuh-mcp-credentials
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
