apiVersion: batch/v1
kind: Job
metadata:
  name: cortex-self-update
  namespace: cortex-system
  labels:
    app: cortex-self-update
    component: cicd
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: cortex-self-update
    spec:
      restartPolicy: OnFailure
      serviceAccountName: cortex-admin

      initContainers:
      # Clone repository
      - name: git-clone
        image: alpine/git:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            git clone https://${GIT_TOKEN}@github.com/${GIT_USERNAME}/cortex.git /workspace
            cd /workspace
            git checkout docker-container
            git config user.name "${GIT_USERNAME}"
            git config user.email "${GIT_EMAIL}"
        env:
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-credentials
              key: token
        - name: GIT_USERNAME
          valueFrom:
            secretKeyRef:
              name: github-credentials
              key: username
        - name: GIT_EMAIL
          valueFrom:
            secretKeyRef:
              name: github-credentials
              key: email
        volumeMounts:
        - name: workspace
          mountPath: /workspace

      containers:
      # Execute self-update logic
      - name: self-updater
        image: ghcr.io/ry-ops/cortex:latest
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            cd /workspace

            echo "=== Cortex Self-Update Job ==="
            echo "Running from: K3s cluster"
            echo "Branch: docker-container"
            echo "Commit: $(git rev-parse --short HEAD)"

            # Make changes (example: update version)
            echo "Making changes..."

            # Commit changes
            git add -A
            git commit -m "feat: Self-update from K3s cluster

            Cortex autonomous self-management:
            - Changes made from within K3s cluster
            - Committed by Cortex CI/CD master
            - Fully autonomous workflow

            🤖 Generated by Cortex (running in K3s)
            " || echo "No changes to commit"

            # Push to GitHub
            git push https://${GIT_TOKEN}@github.com/${GIT_USERNAME}/cortex.git docker-container

            echo "=== Self-Update Complete ==="
        env:
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-credentials
              key: token
        - name: GIT_USERNAME
          valueFrom:
            secretKeyRef:
              name: github-credentials
              key: username
        - name: GIT_EMAIL
          valueFrom:
            secretKeyRef:
              name: github-credentials
              key: email
        volumeMounts:
        - name: workspace
          mountPath: /workspace

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

      volumes:
      - name: workspace
        emptyDir: {}
