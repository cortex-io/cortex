# NodePort service for external API access
# Exposes Cortex API on node IP:30001
apiVersion: v1
kind: Service
metadata:
  name: cortex-api
  namespace: cortex
  labels:
    app: cortex
    component: service
    service-type: api
spec:
  type: NodePort
  selector:
    app: cortex
    component: master
    master-type: coordinator  # Route external traffic to coordinator
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30001  # External access via <node-ip>:30001
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    nodePort: 30090  # Metrics access
    protocol: TCP
