apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cortex-system

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

commonLabels:
  app.kubernetes.io/name: cortex-resource-manager
  app.kubernetes.io/component: infrastructure
  app.kubernetes.io/part-of: cortex
  app.kubernetes.io/managed-by: cortex-cicd

images:
  - name: ghcr.io/ry-ops/cortex-resource-manager
    newTag: latest
