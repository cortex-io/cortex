apiVersion: v1
kind: Service
metadata:
  name: cortex-resource-manager
  namespace: cortex-system
  labels:
    app: cortex-resource-manager
    component: infrastructure
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: cortex-resource-manager
  ports:
  - name: mcp
    port: 8080
    targetPort: mcp
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-resource-manager-headless
  namespace: cortex-system
  labels:
    app: cortex-resource-manager
    component: infrastructure
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: cortex-resource-manager
  ports:
  - name: mcp
    port: 8080
    targetPort: mcp
    protocol: TCP
