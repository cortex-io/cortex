apiVersion: v1
kind: Secret
metadata:
  name: github-credentials
  namespace: cortex-system
  labels:
    app: cortex
    component: cicd
type: Opaque
stringData:
  # GitHub Personal Access Token with repo permissions
  token: "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"

  # Git configuration
  username: "ry-ops"
  email: "cortex@ryandahlberg.com"

  # Repository URL
  repo: "https://github.com/ry-ops/cortex.git"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-config
  namespace: cortex-system
  labels:
    app: cortex
    component: cicd
data:
  # Git operations script
  git-push.sh: |
    #!/bin/bash
    set -euo pipefail

    # Configure git
    git config --global user.name "$GIT_USERNAME"
    git config --global user.email "$GIT_EMAIL"

    # Set up credentials
    git config --global credential.helper store
    echo "https://${GIT_TOKEN}@github.com" > ~/.git-credentials

    # Add, commit, push
    git add -A
    git commit -m "$1" || true
    git push origin "$2"

  git-pull.sh: |
    #!/bin/bash
    set -euo pipefail

    # Configure git
    git config --global user.name "$GIT_USERNAME"
    git config --global user.email "$GIT_EMAIL"

    # Set up credentials
    git config --global credential.helper store
    echo "https://${GIT_TOKEN}@github.com" > ~/.git-credentials

    # Pull latest
    git pull origin "$1"
