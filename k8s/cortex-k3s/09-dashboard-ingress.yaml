---
# Cortex Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-dashboard
  namespace: cortex-system
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-dashboard
  template:
    metadata:
      labels:
        app: cortex-dashboard
    spec:
      containers:
      - name: dashboard
        image: ghcr.io/ry-ops/cortex:latest
        imagePullPolicy: Always
        command: ["node", "eui-dashboard/server/index.js"]
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        volumeMounts:
        - name: coordination
          mountPath: /coordination
          readOnly: true
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: coordination
        persistentVolumeClaim:
          claimName: cortex-coordination-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-dashboard
  namespace: cortex-system
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: dashboard
spec:
  type: LoadBalancer
  selector:
    app: cortex-dashboard
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
---
# Ingress for Cortex Dashboard and API
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex-ingress
  namespace: cortex-system
  annotations:
    kubernetes.io/ingress.class: traefik
  labels:
    app.kubernetes.io/name: cortex
spec:
  rules:
  - host: cortex.k3s.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cortex-dashboard
            port:
              number: 80
      - path: /api/coordinator
        pathType: Prefix
        backend:
          service:
            name: coordinator-master
            port:
              number: 8080
      - path: /api/security
        pathType: Prefix
        backend:
          service:
            name: security-master
            port:
              number: 8080
      - path: /api/development
        pathType: Prefix
        backend:
          service:
            name: development-master
            port:
              number: 8080
      - path: /api/cicd
        pathType: Prefix
        backend:
          service:
            name: cicd-master
            port:
              number: 8080
