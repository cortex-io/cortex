---
# NFS StorageClass for Cortex coordination layer
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-cortex
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
# PersistentVolume pointing to NFS server (CT 105)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cortex-coordination-pv
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: storage
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-cortex
  nfs:
    server: 10.88.140.164  # Proxmox host, proxies to CT 105
    path: /var/lib/vz/private/105/cortex-coordination
  mountOptions:
    - hard
    - nfsvers=4.1
    - nolock
---
# PersistentVolumeClaim for masters to mount
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cortex-coordination-pvc
  namespace: cortex-system
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-cortex
  resources:
    requests:
      storage: 10Gi
  volumeName: cortex-coordination-pv
