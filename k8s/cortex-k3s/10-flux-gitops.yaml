---
# GitRepository source for Flux to watch
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cortex-repo
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://github.com/ry-ops/cortex
  ref:
    branch: docker-container
  secretRef:
    name: github-credentials
---
# Kustomization for cortex-k3s manifests
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cortex-system
  namespace: flux-system
spec:
  interval: 5m0s
  path: "./k8s/cortex-k3s"
  prune: true
  sourceRef:
    kind: GitRepository
    name: cortex-repo
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: coordinator-master
    namespace: cortex-system
  - apiVersion: apps/v1
    kind: Deployment
    name: security-master
    namespace: cortex-system
  - apiVersion: apps/v1
    kind: Deployment
    name: development-master
    namespace: cortex-system
  - apiVersion: apps/v1
    kind: Deployment
    name: cicd-master
    namespace: cortex-system
  timeout: 10m
---
# Secret for GitHub access (template - needs actual token)
apiVersion: v1
kind: Secret
metadata:
  name: github-credentials
  namespace: flux-system
type: Opaque
stringData:
  username: ry-ops
  password: ${GITHUB_TOKEN}
