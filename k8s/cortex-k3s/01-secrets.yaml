kind: Secret
metadata:
  name: cortex-credentials
  namespace: cortex-system
type: Opaque
stringData:
  # Anthropic API key for Claude
  anthropic-api-key: "${ANTHROPIC_API_KEY}"

  # GitHub credentials for GitOps
  github-token: "${GITHUB_TOKEN}"
  github-user: "ry-ops"

  # Wazuh credentials
  wazuh-url: "https://10.88.140.202:55000"
  wazuh-user: "admin"
  wazuh-password: "*B96Y7a0t8Ep9cw+z0RSevdRHwLnsiay"

  # Proxmox credentials (for self-deployment)
  proxmox-host: "10.88.140.164"
  proxmox-token: "root@pam!n8n=b8cc165f-0153-43bb-a48a-5d7459587ca7"

  # NFS server
  nfs-server: "10.88.140.164"  # CT 105 via Proxmox host
  nfs-path: "/var/lib/vz/private/105/cortex-coordination"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-config
  namespace: cortex-system
data:
  # K3s cluster info
  k3s-master: "10.88.145.180"
  k3s-worker-1: "10.88.145.181"
  k3s-worker-2: "10.88.145.182"
  cluster-gateway: "10.88.140.1"

  # Wazuh integration
  wazuh-dashboard: "https://10.88.140.202"
  wazuh-api: "https://10.88.140.202:55000"

  # Coordination layer
  coordination-mount: "/coordination"
  task-queue-path: "/coordination/task-queue.json"

  # Feature flags
  enable-self-evaluation: "true"
  enable-rlhf: "true"
  enable-proactive-scanning: "true"
  enable-autonomous-remediation: "true"

  # Confidence thresholds
  high-confidence-threshold: "0.80"
  medium-confidence-threshold: "0.60"
  auto-deploy-threshold: "0.90"
