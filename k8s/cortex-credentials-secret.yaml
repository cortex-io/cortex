---
# Cortex Credentials Secret
# Contains Anthropic API key and GitHub token
# Apply with: kubectl apply -f cortex-credentials-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: cortex-credentials
  namespace: cortex-system
  labels:
    app: cortex
type: Opaque
stringData:
  anthropic-api-key: "xxxxxx"
  github-token: "xxxxxx"
