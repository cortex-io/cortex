apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cortex-network-policy
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cortex

  policyTypes:
    - Ingress
    - Egress

  # Ingress Rules
  ingress:
    # Allow from Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001

    # Allow from same namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: cortex
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001

  # Egress Rules
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Allow HTTPS for API calls (Anthropic, OpenAI, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443

    # Allow HTTP for health checks and MCP servers
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 5678  # n8n
