openapi: 3.0.3
info:
  title: Commit-Relay Dashboard API
  description: API for managing commit-relay workers, tasks, and system monitoring
  version: 1.0.0
  contact:
    name: Commit-Relay
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: http://localhost:3000/api/v1
    description: Versioned API endpoint

paths:
  /api/health:
    get:
      summary: System health check
      tags: [System]
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/system-status:
    get:
      summary: Get comprehensive system status
      tags: [System]
      responses:
        '200':
          description: Full system status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  /api/tasks:
    get:
      summary: List all tasks
      tags: [Tasks]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, completed, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
    post:
      summary: Create a new task
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /api/tasks/{taskId}:
    get:
      summary: Get task by ID
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /api/workers:
    get:
      summary: List all workers
      tags: [Workers]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
      responses:
        '200':
          description: List of workers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerList'

  /api/workers/{workerId}:
    get:
      summary: Get worker by ID
      tags: [Workers]
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'

  /api/token-budget:
    get:
      summary: Get token budget status
      tags: [Resources]
      responses:
        '200':
          description: Token budget information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBudget'

  /api/daemons/all:
    get:
      summary: Get all daemon statuses
      tags: [Daemons]
      responses:
        '200':
          description: Daemon status list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaemonStatusList'

  /api/moe/status:
    get:
      summary: Get MoE router status
      tags: [MoE]
      responses:
        '200':
          description: MoE router status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoEStatus'

  /api/moe/route:
    post:
      summary: Route a task through MoE
      tags: [MoE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: string
                description:
                  type: string
              required: [task_id, description]
      responses:
        '200':
          description: Routing decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingDecision'

  /api/compliance/status:
    get:
      summary: Get compliance status
      tags: [Compliance]
      responses:
        '200':
          description: Compliance status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceStatus'

  /api/traces:
    get:
      summary: List traces
      tags: [Observability]
      parameters:
        - name: task_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of traces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceList'

  /api/traces/{traceId}:
    get:
      summary: Get trace by ID
      tags: [Observability]
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace details with spans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trace'

  /api/events:
    get:
      summary: Stream dashboard events
      tags: [Events]
      responses:
        '200':
          description: Server-sent events stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            type: string

    SystemStatus:
      type: object
      properties:
        status:
          type: string
        workers:
          type: object
          properties:
            active:
              type: integer
            pending:
              type: integer
            completed:
              type: integer
        tasks:
          type: object
          properties:
            queued:
              type: integer
            in_progress:
              type: integer
        token_budget:
          $ref: '#/components/schemas/TokenBudget'

    Task:
      type: object
      properties:
        task_id:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
        priority:
          type: string
          enum: [low, medium, high, critical]
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    TaskCreate:
      type: object
      properties:
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        worker_type:
          type: string
      required: [description]

    TaskList:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer

    Worker:
      type: object
      properties:
        worker_id:
          type: string
        worker_type:
          type: string
        task_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        token_budget:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    WorkerList:
      type: object
      properties:
        workers:
          type: array
          items:
            $ref: '#/components/schemas/Worker'
        total:
          type: integer

    TokenBudget:
      type: object
      properties:
        total:
          type: integer
        used:
          type: integer
        available:
          type: integer
        last_updated:
          type: string
          format: date-time

    DaemonStatusList:
      type: object
      properties:
        daemons:
          type: object
          additionalProperties:
            type: object
            properties:
              running:
                type: boolean
              pid:
                type: integer
              uptime:
                type: string

    MoEStatus:
      type: object
      properties:
        router_version:
          type: string
        experts:
          type: array
          items:
            type: string
        routing_count:
          type: integer
        last_routing:
          type: string
          format: date-time

    RoutingDecision:
      type: object
      properties:
        task_id:
          type: string
        primary_expert:
          type: string
        primary_confidence:
          type: number
        strategy:
          type: string
        scores:
          type: object
          additionalProperties:
            type: number
        explanation:
          type: string

    ComplianceStatus:
      type: object
      properties:
        overall:
          type: object
          properties:
            score:
              type: number
            status:
              type: string
        frameworks:
          type: object
          additionalProperties:
            type: object
            properties:
              score:
                type: number
              status:
                type: string
              controls:
                type: integer

    Trace:
      type: object
      properties:
        trace_id:
          type: string
        name:
          type: string
        status:
          type: string
        started_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        spans:
          type: array
          items:
            $ref: '#/components/schemas/Span'

    Span:
      type: object
      properties:
        span_id:
          type: string
        parent_span_id:
          type: string
        name:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        duration_ms:
          type: integer
        status:
          type: string
        attributes:
          type: object

    TraceList:
      type: object
      properties:
        traces:
          type: array
          items:
            $ref: '#/components/schemas/Trace'
        total:
          type: integer

tags:
  - name: System
    description: System health and status
  - name: Tasks
    description: Task management
  - name: Workers
    description: Worker management
  - name: Resources
    description: Resource allocation
  - name: Daemons
    description: Background daemon management
  - name: MoE
    description: Mixture of Experts routing
  - name: Compliance
    description: Security compliance
  - name: Observability
    description: Tracing and monitoring
  - name: Events
    description: Real-time events
