name: Integration Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NAMESPACE: cortex-test-${{ github.run_id }}

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl context
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create test namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }}
          kubectl label namespace ${{ env.NAMESPACE }} \
            test=true \
            pr=${{ github.event.pull_request.number || 'manual' }} \
            created=$(date +%s)

      - name: Deploy Cortex to test environment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Create secrets
          kubectl create secret generic cortex-secrets \
            --from-literal=anthropic-api-key="$ANTHROPIC_API_KEY" \
            --namespace=${{ env.NAMESPACE }}

          # Apply manifests
          kubectl apply -f k8s/serviceaccount.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s/configmap.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s/pvc.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s/deployment.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s/service.yaml -n ${{ env.NAMESPACE }}

      - name: Wait for deployments to be ready
        run: |
          kubectl wait --for=condition=available \
            deployment/cortex-coordinator \
            -n ${{ env.NAMESPACE }} \
            --timeout=5m || true

          kubectl wait --for=condition=available \
            deployment/cortex-development-master \
            -n ${{ env.NAMESPACE }} \
            --timeout=5m || true

      - name: Run integration tests
        run: |
          chmod +x scripts/testing/k8s-integration-tests.sh
          NAMESPACE=${{ env.NAMESPACE }} ./scripts/testing/k8s-integration-tests.sh

      - name: Collect test results
        if: always()
        run: |
          echo "=== Test Results ==="
          if [ -f /tmp/cortex-test-results.json ]; then
            cat /tmp/cortex-test-results.json | jq '.'
          fi

      - name: Get pod logs on failure
        if: failure()
        run: |
          echo "=== Coordinator Logs ==="
          kubectl logs -n ${{ env.NAMESPACE }} \
            deployment/cortex-coordinator --tail=100 || true

          echo "=== Development Master Logs ==="
          kubectl logs -n ${{ env.NAMESPACE }} \
            deployment/cortex-development-master --tail=100 || true

      - name: Cleanup test namespace
        if: always()
        run: |
          kubectl delete namespace ${{ env.NAMESPACE }} --ignore-not-found=true

      - name: Comment test results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results = { passed: false, message: 'Tests did not run' };

            try {
              if (fs.existsSync('/tmp/cortex-test-results.json')) {
                results = JSON.parse(fs.readFileSync('/tmp/cortex-test-results.json', 'utf8'));
              }
            } catch (e) {
              console.error('Failed to read test results:', e);
            }

            const status = results.passed ? '✅ PASSED' : '❌ FAILED';
            const body = `## Integration Tests ${status}\n\n` +
                         `**Test Suite:** Cortex K8s Integration\n` +
                         `**Namespace:** ${{ env.NAMESPACE }}\n` +
                         `**Results:** ${results.message}\n\n` +
                         `[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl context
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config

      - name: Run performance tests
        run: |
          chmod +x scripts/testing/performance-tests.sh
          ./scripts/testing/performance-tests.sh

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: /tmp/cortex-performance-report.txt
