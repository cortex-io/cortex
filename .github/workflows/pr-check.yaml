name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  NODE_VERSION: '20.x'

jobs:
  # PR metadata validation
  pr-metadata:
    name: Validate PR Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title format
        uses: actions/github-script@v7
        with:
          script: |
            // Dependabot PRs follow their own title format — skip validation
            if (context.actor === 'dependabot[bot]') {
              core.info('Skipping title check for Dependabot PR');
              return;
            }
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+/;

            if (!pattern.test(title)) {
              core.setFailed(
                'PR title must follow conventional commits format:\n' +
                'type(scope): description\n\n' +
                'Examples:\n' +
                '- feat(mcp-k8s): add pod scaling support\n' +
                '- fix(dashboard): resolve memory leak\n' +
                '- docs(readme): update installation guide'
              );
            }

      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            // Dependabot PRs use auto-generated descriptions — skip validation
            if (context.actor === 'dependabot[bot]') {
              core.info('Skipping description check for Dependabot PR');
              return;
            }
            const body = context.payload.pull_request.body || '';

            if (body.length < 50) {
              core.setFailed('PR description must be at least 50 characters');
            }

            const requiredSections = ['## Summary', '## Changes', '## Testing'];
            const missingSections = requiredSections.filter(section => !body.includes(section));

            if (missingSections.length > 0) {
              core.warning(
                'PR description should include:\n' +
                missingSections.join('\n')
              );
            }

      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          # Dependabot branches use their own naming convention — allow them
          if echo "$BRANCH" | grep -qE "^dependabot/"; then
            echo "Dependabot branch — skipping branch name check"
            exit 0
          fi
          PATTERN="^(feature|bugfix|hotfix|release|refactor)/[a-z0-9-]+$"
          if ! echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "Branch name must follow pattern: type/description"
            echo "Examples: feature/add-monitoring, bugfix/fix-memory-leak"
            exit 1
          fi

      - name: Check for WIP
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const draft = context.payload.pull_request.draft;

            if (title.toLowerCase().includes('wip') && !draft) {
              core.setFailed('PRs with WIP in title should be marked as draft');
            }

  # Conventional commits check
  commit-lint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Validate commits
        run: |
          # Get all commits in PR
          git fetch origin ${{ github.base_ref }}

          # Lint each commit
          for commit in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            echo "Checking commit: $commit"
            git log --format=%B -n 1 $commit | npx commitlint
          done

  # Code quality checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run prettier check
        run: npm run format:check

      - name: Run type check
        run: npm run typecheck

      - name: Check for console.log
        run: |
          if git diff origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.js' | grep -E '^\+.*console\.(log|debug|info)'; then
            echo "WARNING: Found console.log statements in diff"
            echo "Please remove or replace with proper logging"
            exit 1
          fi

      - name: Check for TODO comments
        run: |
          TODOS=$(git diff origin/${{ github.base_ref }}...HEAD | grep -E '^\+.*TODO' || true)
          if [ -n "$TODOS" ]; then
            echo "New TODO comments found:"
            echo "$TODOS"
            echo "Please create issues for TODOs and reference them"
          fi

  # Test coverage
  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check coverage thresholds
        run: |
          # Extract coverage percentage
          COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)

          echo "Coverage: ${COVERAGE}%"

          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "ERROR: Coverage ${COVERAGE}% is below threshold (80%)"
            exit 1
          fi

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));

            const comment = `## Test Coverage Report

            | Metric | Coverage |
            |--------|----------|
            | Lines | ${coverage.total.lines.pct}% |
            | Statements | ${coverage.total.statements.pct}% |
            | Functions | ${coverage.total.functions.pct}% |
            | Branches | ${coverage.total.branches.pct}% |

            ${coverage.total.lines.pct >= 80 ? '✅ Coverage meets threshold (80%)' : '❌ Coverage below threshold (80%)'}`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Test Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # Changed files analysis
  changed-files:
    name: Analyze Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            packages/**
            coordination/**
            scripts/**
            .github/workflows/**

      - name: Analyze impact
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = `${{ steps.changed-files.outputs.all_changed_files }}`.split(' ');

            const analysis = {
              packages: changedFiles.filter(f => f.startsWith('packages/')),
              coordination: changedFiles.filter(f => f.startsWith('coordination/')),
              scripts: changedFiles.filter(f => f.startsWith('scripts/')),
              workflows: changedFiles.filter(f => f.startsWith('.github/workflows/'))
            };

            let comment = '## Changed Files Analysis\n\n';

            if (analysis.packages.length > 0) {
              comment += `### Packages Modified (${analysis.packages.length})\n`;
              comment += '- ' + analysis.packages.join('\n- ') + '\n\n';
              comment += '⚠️ Package changes require version bump and changelog update\n\n';
            }

            if (analysis.coordination.length > 0) {
              comment += `### Coordination Files Modified (${analysis.coordination.length})\n`;
              comment += '- ' + analysis.coordination.join('\n- ') + '\n\n';
              comment += '📋 Coordination changes may affect master/worker behavior\n\n';
            }

            if (analysis.scripts.length > 0) {
              comment += `### Scripts Modified (${analysis.scripts.length})\n`;
              comment += '- ' + analysis.scripts.join('\n- ') + '\n\n';
              comment += '🔧 Script changes should be tested manually\n\n';
            }

            if (analysis.workflows.length > 0) {
              comment += `### Workflows Modified (${analysis.workflows.length})\n`;
              comment += '- ' + analysis.workflows.join('\n- ') + '\n\n';
              comment += '⚙️ CI/CD changes - verify workflow syntax\n\n';
            }

            comment += `\n**Total files changed:** ${changedFiles.length}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Security check
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        run: |
          npm audit --audit-level=high || {
            echo "Security vulnerabilities found!"
            echo "Run 'npm audit' locally and fix issues"
            exit 1
          }

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  # Build verification
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Check build size
        run: |
          # Check if any package build exceeds reasonable size
          find packages/*/dist -type f -size +10M -exec ls -lh {} \; | while read line; do
            echo "WARNING: Large build artifact detected: $line"
          done

  # PR size check
  pr-size:
    name: Check PR Size
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const additions = context.payload.pull_request.additions;
            const deletions = context.payload.pull_request.deletions;
            const changes = additions + deletions;

            let label = '';
            let comment = '';

            if (changes < 100) {
              label = 'size/XS';
            } else if (changes < 300) {
              label = 'size/S';
            } else if (changes < 600) {
              label = 'size/M';
            } else if (changes < 1200) {
              label = 'size/L';
              comment = '⚠️ Large PR detected. Consider splitting into smaller PRs.';
            } else {
              label = 'size/XL';
              comment = '⚠️ Extra large PR detected. Please split into smaller, focused PRs for easier review.';
            }

            // Add size label
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [label]
            });

            // Add comment for large PRs
            if (comment) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # Auto-labeling
  auto-label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Label based on files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  # PR validation summary
  pr-validation-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs:
      - pr-metadata
      - commit-lint
      - code-quality
      - test-coverage
      - changed-files
      - security-check
      - build-check
    if: always()

    steps:
      - name: Generate summary
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'PR Metadata': '${{ needs.pr-metadata.result }}',
              'Commit Lint': '${{ needs.commit-lint.result }}',
              'Code Quality': '${{ needs.code-quality.result }}',
              'Test Coverage': '${{ needs.test-coverage.result }}',
              'Changed Files': '${{ needs.changed-files.result }}',
              'Security Check': '${{ needs.security-check.result }}',
              'Build Check': '${{ needs.build-check.result }}'
            };

            const failed = Object.entries(results).filter(([_, status]) => status === 'failure');
            const passed = Object.entries(results).filter(([_, status]) => status === 'success');

            let summary = '## PR Validation Summary\n\n';

            if (failed.length === 0) {
              summary += '✅ All validation checks passed!\n\n';
            } else {
              summary += `❌ ${failed.length} check(s) failed:\n\n`;
              failed.forEach(([check, _]) => {
                summary += `- ❌ ${check}\n`;
              });
              summary += '\n';
            }

            summary += '### Detailed Results\n\n';
            summary += '| Check | Status |\n';
            summary += '|-------|--------|\n';

            Object.entries(results).forEach(([check, status]) => {
              const emoji = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⏭️';
              summary += `| ${check} | ${emoji} ${status} |\n`;
            });

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Check validation status
        run: |
          if [[ "${{ needs.pr-metadata.result }}" == "failure" ]] || \
             [[ "${{ needs.commit-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.code-quality.result }}" == "failure" ]] || \
             [[ "${{ needs.test-coverage.result }}" == "failure" ]] || \
             [[ "${{ needs.security-check.result }}" == "failure" ]] || \
             [[ "${{ needs.build-check.result }}" == "failure" ]]; then
            echo "PR validation failed!"
            exit 1
          fi
