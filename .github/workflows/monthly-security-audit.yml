name: Monthly Security Audit

on:
  schedule:
    # First day of each month at 10 AM UTC
    - cron: '0 10 1 * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  pages: write
  id-token: write
  security-events: read

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python dependencies
        run: |
          cd reports
          pip install polars anthropic plotly pandas

      - name: Run security scans
        run: |
          # Run any security scanning scripts
          if [ -f scripts/security/run-security-scans.sh ]; then
            bash scripts/security/run-security-scans.sh
          fi

      - name: Render security audit report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd reports
          quarto render security-audit.qmd

      - name: Upload security audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: |
            reports/_site/security-audit.html
            reports/security-audit.html
            reports/security-audit.pdf
          retention-days: 365

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/_site
          destination_dir: reports

      - name: Create summary
        run: |
          echo "## Security Audit Report Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Monthly security audit has been completed and published." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View report at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/security-audit.html" >> $GITHUB_STEP_SUMMARY

      - name: Check for critical vulnerabilities
        run: |
          # Parse security-audit.html or scan-results.jsonl for critical findings
          if [ -f coordination/security/scan-results.jsonl ]; then
            CRITICAL_COUNT=$(jq -r 'select(.severity=="critical") | .finding_count' coordination/security/scan-results.jsonl 2>/dev/null | awk '{s+=$1} END {print s}' || echo "0")
            if [ "$CRITICAL_COUNT" -gt "0" ]; then
              echo "::warning::Found $CRITICAL_COUNT critical security findings! Review immediately."
              echo "CRITICAL_FINDINGS=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
            fi
          fi
