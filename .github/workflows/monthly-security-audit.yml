name: Monthly Security Audit

on:
  schedule:
    # First day of each month at 10 AM UTC
    - cron: '0 10 1 * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  security-events: read

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python dependencies
        run: |
          cd reports
          pip install polars anthropic plotly pandas

      - name: Run security scans
        run: |
          # Run any security scanning scripts
          if [ -f scripts/security/run-security-scans.sh ]; then
            bash scripts/security/run-security-scans.sh
          fi

      - name: Render security audit report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd reports
          quarto render security-audit.qmd

      - name: Upload security audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_number }}
          path: |
            reports/_site/security-audit.html
            reports/security-audit.html
          retention-days: 365

      - name: Check for critical vulnerabilities
        id: check-critical
        run: |
          CRITICAL_COUNT=0
          if [ -f coordination/security/scan-results.jsonl ]; then
            CRITICAL_COUNT=$(jq -r 'select(.severity=="critical") | .finding_count' coordination/security/scan-results.jsonl 2>/dev/null | awk '{s+=$1} END {print s}' || echo "0")
          fi
          echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          if [ "$CRITICAL_COUNT" -gt "0" ]; then
            echo "::warning::Found $CRITICAL_COUNT critical security findings!"
          fi

      - name: Send email with security report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Cortex Security Audit - ${{ steps.check-critical.outputs.critical_count > 0 && '⚠️ CRITICAL FINDINGS' || 'Monthly Report' }}"
          to: ryan@ry-ops.dev
          from: Cortex Security <${{ secrets.MAIL_USERNAME }}>
          html_body: |
            <h1>Cortex Monthly Security Audit</h1>
            ${{ steps.check-critical.outputs.critical_count > 0 && '<p style="color: red; font-weight: bold;">⚠️ CRITICAL VULNERABILITIES DETECTED</p>' || '<p style="color: green;">✅ No critical vulnerabilities found</p>' }}
            <p>Your monthly security audit report is attached.</p>
            <h2>Summary:</h2>
            <ul>
              <li>Critical Findings: ${{ steps.check-critical.outputs.critical_count || '0' }}</li>
            </ul>
            <p>Generated: $(date -u +"%Y-%m-%d %H:%M UTC")</p>
            <p><em>This is an automated security report from Cortex.</em></p>
          attachments: reports/_site/security-audit.html
          priority: ${{ steps.check-critical.outputs.critical_count > 0 && 'high' || 'normal' }}

      - name: Create summary
        run: |
          echo "## 🔒 Security Audit Generated & Emailed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security audit has been completed and emailed to ryan@ry-ops.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Critical Findings:** ${{ steps.check-critical.outputs.critical_count || '0' }}" >> $GITHUB_STEP_SUMMARY
