name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - 'agents/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '.github/workflows/k8s-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: 'staging'
      skip_tests:
        description: 'Skip smoke tests'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for critical vulnerabilities
        run: |
          trivy image --severity CRITICAL --exit-code 1 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-to-k3s:
    name: Deploy to K3s Cluster
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: https://cortex.ryops.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl context
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl config use-context default

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Determine namespace
        id: namespace
        run: |
          case "${{ inputs.environment || 'production' }}" in
            dev)
              echo "namespace=cortex-dev" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "namespace=cortex-staging" >> $GITHUB_OUTPUT
              ;;
            production)
              echo "namespace=cortex" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Create namespace if needed
        run: |
          kubectl create namespace ${{ steps.namespace.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tags in manifests
        run: |
          export NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          # Update deployment.yaml with new image
          sed -i "s|image: ghcr.io/.*|image: $NEW_IMAGE|g" k8s/deployment.yaml

          echo "Updated image to: $NEW_IMAGE"

      - name: Create secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROXMOX_TOKEN_VALUE: ${{ secrets.PROXMOX_TOKEN_VALUE }}
        run: |
          kubectl create secret generic cortex-secrets \
            --from-literal=anthropic-api-key="$ANTHROPIC_API_KEY" \
            --from-literal=proxmox-token-value="$PROXMOX_TOKEN_VALUE" \
            --namespace=${{ steps.namespace.outputs.namespace }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/serviceaccount.yaml -n ${{ steps.namespace.outputs.namespace }}
          kubectl apply -f k8s/configmap.yaml -n ${{ steps.namespace.outputs.namespace }}
          kubectl apply -f k8s/pvc.yaml -n ${{ steps.namespace.outputs.namespace }}
          kubectl apply -f k8s/deployment.yaml -n ${{ steps.namespace.outputs.namespace }}
          kubectl apply -f k8s/service.yaml -n ${{ steps.namespace.outputs.namespace }}
          kubectl apply -f k8s/network-policy.yaml -n ${{ steps.namespace.outputs.namespace }}

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/cortex-coordinator \
            -n ${{ steps.namespace.outputs.namespace }} \
            --timeout=5m

          kubectl rollout status deployment/cortex-development-master \
            -n ${{ steps.namespace.outputs.namespace }} \
            --timeout=5m

          kubectl rollout status deployment/cortex-cicd-master \
            -n ${{ steps.namespace.outputs.namespace }} \
            --timeout=5m

      - name: Verify pod health
        run: |
          kubectl get pods -n ${{ steps.namespace.outputs.namespace }}

          # Wait for all pods to be ready
          kubectl wait --for=condition=ready pod \
            -l app=cortex \
            -n ${{ steps.namespace.outputs.namespace }} \
            --timeout=3m

      - name: Run smoke tests
        if: ${{ !inputs.skip_tests }}
        run: |
          echo "Running smoke tests..."

          # Test 1: Verify coordinator is running
          kubectl exec -n ${{ steps.namespace.outputs.namespace }} \
            deployment/cortex-coordinator -- ls /app/coordination/status.json

          # Test 2: Verify masters can communicate
          kubectl exec -n ${{ steps.namespace.outputs.namespace }} \
            deployment/cortex-coordinator -- cat /app/coordination/status.json

          # Test 3: Check metrics endpoint
          COORDINATOR_POD=$(kubectl get pod -n ${{ steps.namespace.outputs.namespace }} \
            -l app=cortex,component=coordinator -o jsonpath='{.items[0].metadata.name}')

          kubectl exec -n ${{ steps.namespace.outputs.namespace }} $COORDINATOR_POD -- \
            curl -s http://localhost:8080/metrics || true

          echo "Smoke tests passed!"

      - name: Get deployment info
        run: |
          echo "=== Deployment Summary ==="
          echo "Environment: ${{ inputs.environment || 'production' }}"
          echo "Namespace: ${{ steps.namespace.outputs.namespace }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Digest: ${{ needs.build-and-push.outputs.image_digest }}"
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n ${{ steps.namespace.outputs.namespace }} -l app=cortex
          echo ""
          echo "=== Services ==="
          kubectl get svc -n ${{ steps.namespace.outputs.namespace }}

      - name: Create deployment annotation in Grafana
        if: success()
        continue-on-error: true
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL || 'http://grafana:3000' }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          if [ -n "$GRAFANA_TOKEN" ]; then
            curl -X POST "$GRAFANA_URL/api/annotations" \
              -H "Authorization: Bearer $GRAFANA_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "text": "Cortex deployed: '"${{ github.sha }}"'",
                "tags": ["deployment", "kubernetes", "cortex"],
                "time": '"$(date +%s)000"'
              }'
          fi

  rollback-on-failure:
    name: Rollback on Deployment Failure
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-k3s]
    if: failure()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl context
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollback deployments
        run: |
          NAMESPACE="${{ inputs.environment == 'staging' && 'cortex-staging' || inputs.environment == 'dev' && 'cortex-dev' || 'cortex' }}"

          echo "Rolling back deployments in namespace: $NAMESPACE"

          kubectl rollout undo deployment/cortex-coordinator -n $NAMESPACE || true
          kubectl rollout undo deployment/cortex-development-master -n $NAMESPACE || true
          kubectl rollout undo deployment/cortex-cicd-master -n $NAMESPACE || true
          kubectl rollout undo deployment/cortex-security-master -n $NAMESPACE || true

      - name: Verify rollback
        run: |
          NAMESPACE="${{ inputs.environment == 'staging' && 'cortex-staging' || inputs.environment == 'dev' && 'cortex-dev' || 'cortex' }}"
          kubectl get pods -n $NAMESPACE

      - name: Create incident issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Deployment Failed - Rollback Executed`,
              body: `## Deployment Failure\n\n` +
                    `**Environment:** ${{ inputs.environment || 'production' }}\n` +
                    `**Commit:** ${{ github.sha }}\n` +
                    `**Workflow:** ${{ github.run_id }}\n\n` +
                    `Deployment failed and automatic rollback was executed.\n\n` +
                    `Please review the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).`,
              labels: ['incident', 'deployment', 'automated']
            });

      - name: Notify team
        if: always()
        run: |
          echo "Deployment failed. Rollback executed. Incident issue created."
          echo "Review logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
