name: Cortex Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push cortex image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./eui-dashboard
          file: ./eui-dashboard/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dashboard:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://cortex-staging.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create namespace
        run: |
          kubectl create namespace cortex-staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secrets
        run: |
          kubectl create secret generic cortex-credentials \
            --namespace=cortex-staging \
            --from-literal=anthropic-api-key="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=github-token="${{ secrets.GH_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to staging with Kustomize
        run: |
          cd k8s/environments/staging
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/coordinator-master -n cortex-staging --timeout=5m
          kubectl rollout status deployment/security-master -n cortex-staging --timeout=5m
          kubectl rollout status deployment/development-master -n cortex-staging --timeout=5m
          kubectl rollout status deployment/cicd-master -n cortex-staging --timeout=5m

      - name: Run smoke tests
        run: |
          ./scripts/testing/smoke-test.sh staging || echo "Smoke tests not configured"

      - name: Deployment summary
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployed image: \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods Status" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n cortex-staging -o wide >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: (github.ref == 'refs/heads/main' && needs.deploy-staging.result == 'success') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://cortex.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_K3S }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace
        run: |
          kubectl create namespace cortex-system --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secrets
        run: |
          kubectl create secret generic cortex-credentials \
            --namespace=cortex-system \
            --from-literal=anthropic-api-key="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=github-token="${{ secrets.GH_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to production with Kustomize
        run: |
          cd k8s/cortex-k3s
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/coordinator-master -n cortex-system --timeout=10m
          kubectl rollout status deployment/security-master -n cortex-system --timeout=10m
          kubectl rollout status deployment/development-master -n cortex-system --timeout=10m
          kubectl rollout status deployment/cicd-master -n cortex-system --timeout=10m
          kubectl rollout status deployment/cortex-dashboard -n cortex-system --timeout=5m

      - name: Run smoke tests
        run: |
          ./scripts/testing/smoke-test.sh production || echo "Smoke tests not configured"

      - name: Verify deployment
        run: |
          ./k8s/cortex-k3s/verify-deployment.sh || echo "Verification script needs cluster access"

      - name: Deployment summary
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployed image: \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods Status" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n cortex-system -o wide >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment
        if: always()
        run: |
          # Add notification logic here (Slack, Discord, etc.)
          echo "Production deployment completed"

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-production.result == 'failure'
    needs: deploy-production
    environment:
      name: production
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_K3S }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollback deployments
        run: |
          kubectl rollout undo deployment/coordinator-master -n cortex-system
          kubectl rollout undo deployment/security-master -n cortex-system
          kubectl rollout undo deployment/development-master -n cortex-system
          kubectl rollout undo deployment/cicd-master -n cortex-system
          kubectl rollout undo deployment/cortex-dashboard -n cortex-system

      - name: Wait for rollback
        run: |
          kubectl rollout status deployment/coordinator-master -n cortex-system --timeout=5m
          kubectl rollout status deployment/security-master -n cortex-system --timeout=5m
          kubectl rollout status deployment/development-master -n cortex-system --timeout=5m
          kubectl rollout status deployment/cicd-master -n cortex-system --timeout=5m

      - name: Notify rollback
        run: |
          echo "❌ Production deployment failed and was rolled back" >> $GITHUB_STEP_SUMMARY
