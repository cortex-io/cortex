name: Generate Weekly Report

on:
  schedule:
    # Every Monday at 9 AM UTC
    - cron: '0 9 * * MON'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python dependencies
        run: |
          pip install jupyter pyyaml pyarrow
          cd reports
          pip install polars anthropic plotly pandas pytz

      - name: Render weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd reports
          quarto render weekly-summary.qmd

      - name: Render security audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd reports
          quarto render security-audit.qmd

      - name: Render cost report
        run: |
          cd reports
          quarto render cost-report.qmd

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports-${{ github.run_number }}
          path: |
            reports/_site/**
            reports/*.html
          retention-days: 90

      - name: Send email with reports
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Cortex Weekly Report - ${{ github.run_id }}"
          to: ryan@ry-ops.dev
          from: Cortex Reports <${{ secrets.MAIL_USERNAME }}>
          html_body: |
            <h1>Cortex Weekly Report</h1>
            <p>Your weekly Cortex reports are attached.</p>
            <h2>Reports Included:</h2>
            <ul>
              <li>Weekly Summary</li>
              <li>Security Audit</li>
              <li>Cost Report</li>
            </ul>
            <p>Generated: ${{ github.event.head_commit.timestamp || 'Manual trigger' }}</p>
            <p><em>This is an automated message from Cortex.</em></p>
          attachments: |
            reports/_site/weekly-summary.html,
            reports/_site/security-audit.html,
            reports/_site/cost-report.html

      - name: Create summary
        run: |
          echo "## 📊 Weekly Report Generated & Emailed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports have been generated and emailed to ryan@ry-ops.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reports:**" >> $GITHUB_STEP_SUMMARY
          echo "- Weekly Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "- Cost Report" >> $GITHUB_STEP_SUMMARY
