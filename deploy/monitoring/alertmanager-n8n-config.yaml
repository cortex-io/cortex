# Alertmanager Configuration with n8n Webhook Integration
# This configuration extends the base Alertmanager setup with n8n workflow webhooks

global:
  resolve_timeout: 5m
  # Optional: Slack webhook for backup notifications
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

# Templates for alert messages
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route configuration
route:
  receiver: 'default'
  group_by: ['alertname', 'component', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # Child routes with n8n integration
  routes:
    # Critical alerts to n8n critical handler
    - match:
        severity: critical
      receiver: 'n8n-critical'
      continue: true
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts to n8n warning handler
    - match:
        severity: warning
      receiver: 'n8n-warnings'
      continue: true
      group_wait: 30s
      repeat_interval: 4h

    # Info alerts
    - match:
        severity: info
      receiver: 'n8n-info'
      continue: false

    # Core component alerts (also route to critical handler)
    - match:
        component: meta-agent
      receiver: 'n8n-critical'
      continue: true

    # Master alerts
    - match:
        component: master
      receiver: 'n8n-warnings'
      continue: true

    # Worker alerts
    - match:
        component: worker
      receiver: 'n8n-info'

    # MCP server alerts
    - match:
        component: mcp
      receiver: 'n8n-warnings'

    # Contractor alerts
    - match:
        component: contractor
      receiver: 'n8n-info'

# Inhibition rules (suppress alerts based on other alerts)
inhibit_rules:
  # Suppress worker alerts if master is down
  - source_match:
      component: master
      alertname: MasterAgentDown
    target_match:
      component: worker
    equal: ['parent_master']

  # Suppress high error rate if service is down
  - source_match_re:
      alertname: '.+Down'
    target_match_re:
      alertname: '.+HighErrorRate'
    equal: ['component']

  # Suppress resource alerts if pod is restarting
  - source_match:
      alertname: PodRestartLoop
    target_match_re:
      alertname: 'High(CPU|Memory)Usage'
    equal: ['pod']

# Receiver configurations with n8n webhooks
receivers:
  # Default receiver (fallback to Slack or webhook)
  - name: 'default'
    webhook_configs:
      - url: 'http://10.88.140.149:5678/webhook/warning-alerts'
        send_resolved: true
        http_config:
          follow_redirects: true

  # n8n Critical Alert Handler
  - name: 'n8n-critical'
    webhook_configs:
      - url: 'http://10.88.140.149:5678/webhook/critical-alerts'
        send_resolved: true
        http_config:
          follow_redirects: true
        # Optional: Add authentication if needed
        # http_config:
        #   basic_auth:
        #     username: 'alertmanager'
        #     password: 'YOUR_PASSWORD'
        max_alerts: 10

  # n8n Warning Alert Handler
  - name: 'n8n-warnings'
    webhook_configs:
      - url: 'http://10.88.140.149:5678/webhook/warning-alerts'
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 20

  # n8n Info Handler (optional - can route to same as warnings)
  - name: 'n8n-info'
    webhook_configs:
      - url: 'http://10.88.140.149:5678/webhook/warning-alerts'
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 50

  # Backup Slack receiver (optional - if n8n fails)
  - name: 'slack-backup'
    slack_configs:
      - channel: '#cortex-alerts'
        title: '[{{ .Status | toUpper }}] Cortex Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Component:* {{ .Labels.component }}
          *Description:* {{ .Annotations.description }}
          *Summary:* {{ .Annotations.summary }}
          {{ end }}
        send_resolved: true

# Notes:
# 1. Replace http://10.88.140.149:5678 with your n8n server URL
# 2. Webhook URLs must match the paths configured in n8n workflows:
#    - /webhook/critical-alerts (critical-alert-handler workflow)
#    - /webhook/warning-alerts (warning-alert-handler workflow)
# 3. Enable authentication in n8n webhooks for production use
# 4. Configure Slack webhook URL in global section for backup notifications
# 5. Adjust group_wait, group_interval, and repeat_interval based on your needs
# 6. max_alerts limits the number of alerts sent in a single webhook call
