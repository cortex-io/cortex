<!--
  File Integrity Monitoring (FIM) Configuration for Cortex

  Purpose: Monitor critical Cortex configuration and deployment files
  Integration: Add to /var/ossec/etc/ossec.conf on Wazuh agents monitoring Cortex

  Note: This configuration should be added to the <syscheck> section

  Monitored Paths:
  - /Users/ryandahlberg/Projects/cortex/coordination/ - Master/worker coordination files
  - /Users/ryandahlberg/Projects/cortex/deploy/ - Deployment manifests
  - /Users/ryandahlberg/Projects/cortex/config/ - System configuration
  - /Users/ryandahlberg/Projects/cortex/scripts/ - Automation scripts

  Exclusions:
  - node_modules
  - .git directories
  - log files
  - temporary files
-->

<syscheck>

  <!-- ======================================= -->
  <!-- Scan Frequency and Settings           -->
  <!-- ======================================= -->

  <!-- Scan frequency: Every 6 hours -->
  <frequency>21600</frequency>

  <!-- Enable real-time monitoring on Linux systems -->
  <disabled>no</disabled>

  <!-- Alert on new files -->
  <alert_new_files>yes</alert_new_files>

  <!-- Auto ignore frequency (avoid flooding with temp file changes) -->
  <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

  <!-- Scan on start -->
  <scan_on_start>yes</scan_on_start>

  <!-- ======================================= -->
  <!-- Cortex Coordination Directory          -->
  <!-- ======================================= -->

  <!-- Monitor coordination directory (high priority) -->
  <directories check_all="yes" realtime="yes" report_changes="yes" restrict="\.json$|\.yaml$|\.yml$">
    /Users/ryandahlberg/Projects/cortex/coordination
  </directories>

  <!-- Master state files (critical) -->
  <directories check_all="yes" realtime="yes" report_changes="yes" restrict="master-state\.json$">
    /Users/ryandahlberg/Projects/cortex/coordination/masters
  </directories>

  <!-- Handoff files (monitor for task flow) -->
  <directories check_all="yes" realtime="yes" report_changes="yes" restrict="handoff.*\.json$">
    /Users/ryandahlberg/Projects/cortex/coordination/masters
  </directories>

  <!-- Worker registry -->
  <directories check_all="yes" realtime="yes" report_changes="yes" restrict="worker-types\.json$">
    /Users/ryandahlberg/Projects/cortex/coordination
  </directories>

  <!-- ======================================= -->
  <!-- Deployment Manifests                   -->
  <!-- ======================================= -->

  <!-- Kubernetes manifests -->
  <directories check_all="yes" realtime="yes" report_changes="yes" restrict="\.yaml$|\.yml$">
    /Users/ryandahlberg/Projects/cortex/deploy
  </directories>

  <!-- Monitoring deployment configs -->
  <directories check_all="yes" realtime="yes" report_changes="yes">
    /Users/ryandahlberg/Projects/cortex/deploy/monitoring
  </directories>

  <!-- Security deployment configs -->
  <directories check_all="yes" realtime="yes" report_changes="yes">
    /Users/ryandahlberg/Projects/cortex/deploy/security
  </directories>

  <!-- N8N deployment configs -->
  <directories check_all="yes" realtime="yes" report_changes="yes">
    /Users/ryandahlberg/Projects/cortex/deploy/n8n
  </directories>

  <!-- ======================================= -->
  <!-- Configuration Files                    -->
  <!-- ======================================= -->

  <!-- System configuration (if exists) -->
  <directories check_all="yes" realtime="yes" report_changes="yes" restrict="\.json$|\.yaml$|\.yml$|\.conf$">
    /Users/ryandahlberg/Projects/cortex/config
  </directories>

  <!-- MCP server configurations -->
  <directories check_all="yes" realtime="yes" report_changes="yes" restrict="mcp.*\.json$">
    /Users/ryandahlberg/Projects/cortex
  </directories>

  <!-- ======================================= -->
  <!-- Automation Scripts                     -->
  <!-- ======================================= -->

  <!-- Monitor script changes (could indicate tampering) -->
  <directories check_all="yes" realtime="yes" report_changes="yes" restrict="\.sh$|\.py$">
    /Users/ryandahlberg/Projects/cortex/scripts
  </directories>

  <!-- Master initialization scripts -->
  <directories check_all="yes" realtime="yes" report_changes="yes" restrict="run-.*-master\.sh$">
    /Users/ryandahlberg/Projects/cortex/scripts
  </directories>

  <!-- ======================================= -->
  <!-- Agent Definitions                      -->
  <!-- ======================================= -->

  <!-- Agent prompt files (monitor for unauthorized changes) -->
  <directories check_all="yes" realtime="yes" report_changes="yes" restrict="agent\.md$">
    /Users/ryandahlberg/Projects/cortex/agents
  </directories>

  <!-- Master definitions -->
  <directories check_all="yes" realtime="yes" report_changes="yes" restrict="master\.md$">
    /Users/ryandahlberg/Projects/cortex/coordination/masters
  </directories>

  <!-- ======================================= -->
  <!-- Knowledge Base Files                   -->
  <!-- ======================================= -->

  <!-- Security knowledge base (vulnerability patterns) -->
  <directories check_all="yes" realtime="no" report_changes="yes" restrict="\.json$|\.jsonl$">
    /Users/ryandahlberg/Projects/cortex/coordination/masters/security/knowledge-base
  </directories>

  <!-- Other master knowledge bases -->
  <directories check_all="yes" realtime="no" report_changes="no">
    /Users/ryandahlberg/Projects/cortex/coordination/masters/*/knowledge-base
  </directories>

  <!-- ======================================= -->
  <!-- Global Exclusions                      -->
  <!-- ======================================= -->

  <!-- Ignore node_modules -->
  <ignore type="sregex">.*/node_modules/.*</ignore>

  <!-- Ignore .git directories -->
  <ignore type="sregex">.*\.git/.*</ignore>

  <!-- Ignore log files -->
  <ignore type="sregex">.*\.log$</ignore>
  <ignore type="sregex">.*/logs/.*</ignore>

  <!-- Ignore temporary files -->
  <ignore type="sregex">.*\.tmp$</ignore>
  <ignore type="sregex">.*\.temp$</ignore>
  <ignore type="sregex">.*~$</ignore>

  <!-- Ignore swap files -->
  <ignore type="sregex">.*\.swp$</ignore>
  <ignore type="sregex">.*\.swo$</ignore>

  <!-- Ignore OS-specific files -->
  <ignore type="sregex">.*\.DS_Store$</ignore>
  <ignore type="sregex">.*Thumbs\.db$</ignore>

  <!-- Ignore build artifacts -->
  <ignore type="sregex">.*/dist/.*</ignore>
  <ignore type="sregex">.*/build/.*</ignore>
  <ignore type="sregex">.*\.pyc$</ignore>
  <ignore type="sregex">.*__pycache__.*</ignore>

  <!-- Ignore package lock files (too frequent changes) -->
  <ignore type="sregex">.*package-lock\.json$</ignore>
  <ignore type="sregex">.*yarn\.lock$</ignore>

  <!-- ======================================= -->
  <!-- Check Options                          -->
  <!-- ======================================= -->

  <!-- What to check for each file -->
  <!-- check_all="yes" includes all the following: -->
  <!-- - check_sum: MD5/SHA1 checksum -->
  <!-- - check_sha256sum: SHA256 checksum -->
  <!-- - check_size: File size -->
  <!-- - check_owner: File owner -->
  <!-- - check_group: File group -->
  <!-- - check_perm: File permissions -->
  <!-- - check_mtime: Modification time -->
  <!-- - check_inode: Inode number -->

  <!-- ======================================= -->
  <!-- Synchronization                        -->
  <!-- ======================================= -->

  <!-- Synchronize file checksums with manager -->
  <synchronization>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <max_interval>1h</max_interval>
    <response_timeout>30</response_timeout>
  </synchronization>

  <!-- ======================================= -->
  <!-- Windows Registry Monitoring            -->
  <!-- (Not applicable for macOS/Linux)       -->
  <!-- ======================================= -->

  <!-- ======================================= -->
  <!-- File Limit and Performance             -->
  <!-- ======================================= -->

  <!-- Maximum number of files to monitor -->
  <max_files_per_second>100</max_files_per_second>

  <!-- Skip files larger than (in KB) -->
  <skip_nfs>yes</skip_nfs>
  <skip_dev>yes</skip_dev>
  <skip_proc>yes</skip_proc>
  <skip_sys>yes</skip_sys>

</syscheck>

<!--
  Deployment Instructions:

  1. SSH to Wazuh agent monitoring Cortex:
     ssh user@cortex-host

  2. Edit Wazuh agent configuration:
     sudo nano /var/ossec/etc/ossec.conf

  3. Add the above <syscheck> configuration to the file
     (Replace existing <syscheck> section or merge carefully)

  4. Test configuration:
     sudo /var/ossec/bin/wazuh-control check-config

  5. Restart Wazuh agent:
     sudo systemctl restart wazuh-agent

  6. Verify FIM is working:
     sudo grep "syscheck" /var/ossec/logs/ossec.log

  7. Trigger a test alert:
     touch /Users/ryandahlberg/Projects/cortex/coordination/test-fim.json

  8. Check Wazuh dashboard for FIM alerts within 5 minutes

  Expected Alerts:
  - Rule 550: Integrity checksum changed
  - Rule 554: File added to the system
  - Rule 553: File deleted
  - Rule 556: File permission changed
-->
