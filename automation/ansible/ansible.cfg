[defaults]
# Ansible configuration for Cortex automation framework

# Inventory
inventory = ./inventory/localhost.yml
host_key_checking = False

# Output
stdout_callback = yaml
display_skipped_hosts = False
display_ok_hosts = True

# Behavior
gathering = explicit
retry_files_enabled = False
command_warnings = False

# Timeouts
timeout = 30

# Paths
roles_path = ./roles
action_plugins = /usr/share/ansible/plugins/action
library = /usr/share/ansible/plugins/modules

# Performance
forks = 5
pipelining = True

# Privilege Escalation (not needed for local automation)
become = False

[privilege_escalation]
become = False

[ssh_connection]
# Not used for local connections, but good to have
pipelining = True
