---
# Wazuh Indexer with Security Plugin Enabled
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-indexer
  namespace: wazuh-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-indexer
  template:
    metadata:
      labels:
        app: wazuh-indexer
    spec:
      initContainers:
      - name: set-permissions
        image: busybox:1.36
        command: ['sh', '-c', 'chown -R 1000:1000 /usr/share/wazuh-indexer/data']
        volumeMounts:
        - name: data
          mountPath: /usr/share/wazuh-indexer/data
      containers:
      - name: wazuh-indexer
        image: wazuh/wazuh-indexer:4.7.0
        env:
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        - name: discovery.type
          value: "single-node"
        - name: network.host
          value: "0.0.0.0"
        # Enable security plugin (remove or set to false)
        - name: DISABLE_SECURITY_PLUGIN
          value: "false"
        - name: DISABLE_INSTALL_DEMO_CONFIG
          value: "true"
        ports:
        - containerPort: 9200
          name: https
        - containerPort: 9300
          name: transport
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: data
          mountPath: /usr/share/wazuh-indexer/data
        - name: config
          mountPath: /usr/share/wazuh-indexer/opensearch.yml
          subPath: opensearch.yml
        - name: certs
          mountPath: /usr/share/wazuh-indexer/certs
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 9200
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9200
          initialDelaySeconds: 90
          periodSeconds: 20
      volumes:
      - name: data
        emptyDir: {}
      - name: config
        configMap:
          name: indexer-config-simple
      - name: certs
        secret:
          secretName: indexer-certs

---
# Job to Initialize Security Plugin
apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-indexer-security-init
  namespace: wazuh-security
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: wazuh-indexer-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: security-init
        image: wazuh/wazuh-indexer:4.7.0
        command:
        - /bin/bash
        - -c
        - |
          #!/bin/bash
          set -e

          echo "Waiting for Wazuh Indexer to be ready..."
          until curl -sk -u admin:admin https://wazuh-indexer.wazuh-security.svc.cluster.local:9200 2>/dev/null; do
            echo "Indexer not ready yet, waiting..."
            sleep 5
          done

          echo "Indexer is ready, initializing security plugin..."

          # Run securityadmin to initialize the security index
          /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh \
            -cd /usr/share/wazuh-indexer/plugins/opensearch-security/securityconfig/ \
            -icl \
            -nhnv \
            -cacert /usr/share/wazuh-indexer/certs/root-ca.pem \
            -cert /usr/share/wazuh-indexer/certs/admin.pem \
            -key /usr/share/wazuh-indexer/certs/admin-key.pem \
            -h wazuh-indexer.wazuh-security.svc.cluster.local

          echo "Security plugin initialized successfully!"

          # Verify the security index was created
          echo "Verifying security index..."
          curl -sk -u admin:admin https://wazuh-indexer.wazuh-security.svc.cluster.local:9200/_cat/indices?v

          echo "Initialization complete!"
        volumeMounts:
        - name: certs
          mountPath: /usr/share/wazuh-indexer/certs
          readOnly: true
      volumes:
      - name: certs
        secret:
          secretName: indexer-certs
