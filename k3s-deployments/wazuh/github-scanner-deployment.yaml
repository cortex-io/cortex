apiVersion: v1
kind: ConfigMap
metadata:
  name: github-scanner-script
  namespace: wazuh-security
data:
  github-security-scanner.sh: |
    #!/bin/bash
    #
    # GitHub Security Scanner for Wazuh v4.7.0
    # Polls GitHub API for security events and sends to Wazuh
    #

    set -e

    GITHUB_TOKEN="${GITHUB_TOKEN:-}"
    GITHUB_ORG="${GITHUB_ORG:-ry-ops}"
    WAZUH_LOG_FILE="/var/ossec/logs/github-security.log"
    TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
    STATE_FILE="/tmp/github-scanner-state.json"

    # Colors for output
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    YELLOW='\033[1;33m'
    NC='\033[0m' # No Color

    log_info() {
      echo -e "${GREEN}[INFO]${NC} $1"
    }

    log_warn() {
      echo -e "${YELLOW}[WARN]${NC} $1"
    }

    log_error() {
      echo -e "${RED}[ERROR]${NC} $1"
    }

    # Check for required tools
    for cmd in curl jq; do
      if ! command -v $cmd &> /dev/null; then
        log_error "$cmd is required but not installed"
        exit 1
      fi
    done

    if [ -z "$GITHUB_TOKEN" ]; then
      log_error "GITHUB_TOKEN environment variable is required"
      exit 1
    fi

    # GitHub API base URL
    GITHUB_API="https://api.github.com"

    # Initialize state file
    if [ ! -f "$STATE_FILE" ]; then
      echo '{"last_scan": null, "repositories_scanned": [], "events_processed": 0}' > "$STATE_FILE"
    fi

    log_info "Starting GitHub security scan for organization: $GITHUB_ORG"

    # Function to make GitHub API requests
    github_api_request() {
      local endpoint="$1"
      local response

      response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "$GITHUB_API/$endpoint")

      echo "$response"
    }

    # Function to send event to Wazuh
    send_to_wazuh() {
      local event_json="$1"
      echo "$event_json" >> "$WAZUH_LOG_FILE"
    }

    # Get all repositories in the organization
    log_info "Fetching repositories for $GITHUB_ORG..."
    repos=$(github_api_request "orgs/$GITHUB_ORG/repos?per_page=100&sort=updated")

    # Check if API request was successful
    if echo "$repos" | jq -e 'has("message")' > /dev/null 2>&1; then
      error_msg=$(echo "$repos" | jq -r '.message')
      log_error "GitHub API error: $error_msg"
      exit 1
    fi

    repo_count=$(echo "$repos" | jq '. | length')
    log_info "Found $repo_count repositories"

    events_sent=0

    # Process each repository
    echo "$repos" | jq -c '.[]' | while read -r repo; do
      repo_name=$(echo "$repo" | jq -r '.name')
      repo_full_name=$(echo "$repo" | jq -r '.full_name')
      repo_private=$(echo "$repo" | jq -r '.private')
      repo_updated=$(echo "$repo" | jq -r '.updated_at')
      repo_visibility=$(echo "$repo" | jq -r '.visibility')
      default_branch=$(echo "$repo" | jq -r '.default_branch')

      log_info "Processing repository: $repo_name"

      # Check for Dependabot alerts
      log_info "  Checking Dependabot alerts..."
      dependabot_alerts=$(github_api_request "repos/$repo_full_name/dependabot/alerts?state=open&per_page=50")

      if echo "$dependabot_alerts" | jq -e 'has("message")' > /dev/null 2>&1; then
        log_warn "  Dependabot alerts not accessible (may need additional permissions)"
      elif echo "$dependabot_alerts" | jq -e '. | length > 0' > /dev/null 2>&1; then
        alert_count=$(echo "$dependabot_alerts" | jq '. | length')
        log_warn "  Found $alert_count Dependabot alerts"

        # Aggregate by severity
        critical_count=$(echo "$dependabot_alerts" | jq '[.[] | select(.security_advisory.severity == "critical")] | length')
        high_count=$(echo "$dependabot_alerts" | jq '[.[] | select(.security_advisory.severity == "high")] | length')
        medium_count=$(echo "$dependabot_alerts" | jq '[.[] | select(.security_advisory.severity == "medium")] | length')
        low_count=$(echo "$dependabot_alerts" | jq '[.[] | select(.security_advisory.severity == "low")] | length')

        wazuh_event=$(jq -n \
          --arg ts "$TIMESTAMP" \
          --arg org "$GITHUB_ORG" \
          --arg repo "$repo_name" \
          --arg full_name "$repo_full_name" \
          --argjson critical "$critical_count" \
          --argjson high "$high_count" \
          --argjson medium "$medium_count" \
          --argjson low "$low_count" \
          --argjson total "$alert_count" \
          '{
            "timestamp": $ts,
            "source": "github_security",
            "event_type": "dependabot_alerts",
            "organization": $org,
            "repository": $repo,
            "repository_full_name": $full_name,
            "vulnerabilities": {
              "critical": $critical,
              "high": $high,
              "medium": $medium,
              "low": $low,
              "total": $total
            }
          }')

        send_to_wazuh "$wazuh_event"
        events_sent=$((events_sent + 1))
      fi

      # Check repository security settings
      log_info "  Checking repository security settings..."

      has_vulnerability_alerts=$(echo "$repo" | jq -r '.has_vulnerability_alerts // false')

      # Check branch protection
      branch_protection=$(github_api_request "repos/$repo_full_name/branches/$default_branch/protection")

      protected=false
      if ! echo "$branch_protection" | jq -e 'has("message")' > /dev/null 2>&1; then
        protected=true
      fi

      wazuh_event=$(jq -n \
        --arg ts "$TIMESTAMP" \
        --arg org "$GITHUB_ORG" \
        --arg repo "$repo_name" \
        --arg full_name "$repo_full_name" \
        --arg visibility "$repo_visibility" \
        --argjson is_private "$repo_private" \
        --argjson vuln_alerts "$has_vulnerability_alerts" \
        --argjson branch_protected "$protected" \
        --arg default_branch "$default_branch" \
        '{
          "timestamp": $ts,
          "source": "github_security",
          "event_type": "repository_security_status",
          "organization": $org,
          "repository": $repo,
          "repository_full_name": $full_name,
          "security_settings": {
            "visibility": $visibility,
            "is_private": $is_private,
            "vulnerability_alerts_enabled": $vuln_alerts,
            "default_branch_protected": $branch_protected,
            "default_branch": $default_branch
          }
        }')

      send_to_wazuh "$wazuh_event"
      events_sent=$((events_sent + 1))

    done

    # Update state file
    jq -n \
      --arg ts "$TIMESTAMP" \
      --argjson events "$events_sent" \
      '{
        "last_scan": $ts,
        "events_processed": $events,
        "scan_status": "completed"
      }' > "$STATE_FILE"

    log_info "Scan complete! Sent $events_sent events to Wazuh"
    log_info "Events logged to: $WAZUH_LOG_FILE"

    exit 0

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-security-scanner
  namespace: wazuh-security
spec:
  # Run every 30 minutes
  schedule: "*/30 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: scanner
            image: alpine:3.19
            command:
            - /bin/sh
            - -c
            - |
              # Install dependencies
              apk add --no-cache bash curl jq

              # Make script executable
              chmod +x /scripts/github-security-scanner.sh

              # Run the scanner
              /scripts/github-security-scanner.sh
            env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-wazuh-token
                  key: token
            - name: GITHUB_ORG
              value: "ry-ops"
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: wazuh-logs
              mountPath: /var/ossec/logs
          volumes:
          - name: script
            configMap:
              name: github-scanner-script
              defaultMode: 0755
          - name: wazuh-logs
            hostPath:
              path: /var/ossec/logs
              type: DirectoryOrCreate
          nodeSelector:
            kubernetes.io/hostname: k3s-master03  # Run on node with Wazuh manager

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-wazuh-decoder
  namespace: wazuh-security
data:
  github-decoder.xml: |
    <!-- GitHub Security Decoder -->
    <decoder name="github-security-json">
      <prematch>"source":"github_security"</prematch>
    </decoder>

    <decoder name="github-security-json">
      <parent>github-security-json</parent>
      <plugin_decoder>JSON_Decoder</plugin_decoder>
    </decoder>

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-wazuh-rules
  namespace: wazuh-security
data:
  github-rules.xml: |
    <!-- GitHub Security Rules -->
    <group name="github,github_security,">

      <!-- Dependabot Alerts - Critical -->
      <rule id="110001" level="12">
        <decoded_as>github-security-json</decoded_as>
        <field name="event_type">dependabot_alerts</field>
        <field name="vulnerabilities.critical" type="pcre2">^[1-9]\d*$</field>
        <description>GitHub: Critical vulnerabilities detected by Dependabot in $(repository)</description>
        <options>no_full_log</options>
      </rule>

      <!-- Dependabot Alerts - High -->
      <rule id="110002" level="10">
        <decoded_as>github-security-json</decoded_as>
        <field name="event_type">dependabot_alerts</field>
        <field name="vulnerabilities.high" type="pcre2">^[1-9]\d*$</field>
        <description>GitHub: High severity vulnerabilities detected by Dependabot in $(repository)</description>
        <options>no_full_log</options>
      </rule>

      <!-- Dependabot Alerts - Medium -->
      <rule id="110003" level="7">
        <decoded_as>github-security-json</decoded_as>
        <field name="event_type">dependabot_alerts</field>
        <field name="vulnerabilities.medium" type="pcre2">^[1-9]\d*$</field>
        <description>GitHub: Medium severity vulnerabilities detected by Dependabot in $(repository)</description>
        <options>no_full_log</options>
      </rule>

      <!-- Secret Scanning Alerts -->
      <rule id="110004" level="13">
        <decoded_as>github-security-json</decoded_as>
        <field name="event_type">secret_scanning_alerts</field>
        <description>GitHub: Secrets detected in repository $(repository)</description>
        <options>no_full_log</options>
      </rule>

      <!-- Code Scanning Alerts - Errors -->
      <rule id="110005" level="10">
        <decoded_as>github-security-json</decoded_as>
        <field name="event_type">code_scanning_alerts</field>
        <field name="alerts.errors" type="pcre2">^[1-9]\d*$</field>
        <description>GitHub: Code scanning errors detected in $(repository)</description>
        <options>no_full_log</options>
      </rule>

      <!-- Security Advisory -->
      <rule id="110006" level="11">
        <decoded_as>github-security-json</decoded_as>
        <field name="event_type">security_advisory</field>
        <description>GitHub: Security advisory published for $(repository): $(advisory.summary)</description>
        <options>no_full_log</options>
      </rule>

      <!-- Repository Security Status - Insecure Configuration -->
      <rule id="110007" level="8">
        <decoded_as>github-security-json</decoded_as>
        <field name="event_type">repository_security_status</field>
        <field name="security_settings.default_branch_protected">false</field>
        <description>GitHub: Repository $(repository) has unprotected default branch</description>
        <options>no_full_log</options>
      </rule>

      <!-- Repository Security Status - Vulnerability Alerts Disabled -->
      <rule id="110008" level="8">
        <decoded_as>github-security-json</decoded_as>
        <field name="event_type">repository_security_status</field>
        <field name="security_settings.vulnerability_alerts_enabled">false</field>
        <description>GitHub: Repository $(repository) has vulnerability alerts disabled</description>
        <options>no_full_log</options>
      </rule>

      <!-- Repository Security Status - Public Repository -->
      <rule id="110009" level="5">
        <decoded_as>github-security-json</decoded_as>
        <field name="event_type">repository_security_status</field>
        <field name="security_settings.visibility">public</field>
        <description>GitHub: Repository $(repository) is publicly accessible</description>
        <options>no_full_log</options>
      </rule>

      <!-- Audit Log - Security Events -->
      <rule id="110010" level="6">
        <decoded_as>github-security-json</decoded_as>
        <field name="event_type">audit_log_summary</field>
        <description>GitHub: $(audit_events.total) audit events logged for organization</description>
        <options>no_full_log</options>
      </rule>

    </group>
