apiVersion: v1
kind: Namespace
metadata:
  name: cortex
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortex-api
  namespace: cortex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cortex-api-reader
rules:
- apiGroups: [""]
  resources: ["pods", "services", "nodes", "namespaces", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cortex-api-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cortex-api-reader
subjects:
- kind: ServiceAccount
  name: cortex-api
  namespace: cortex
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-orchestrator
  namespace: cortex
  labels:
    app: cortex-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-orchestrator
  template:
    metadata:
      labels:
        app: cortex-orchestrator
    spec:
      serviceAccountName: cortex-api
      containers:
      - name: cortex-api
        image: 10.43.170.72:5000/cortex-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-orchestrator
  namespace: cortex
  labels:
    app: cortex-orchestrator
spec:
  selector:
    app: cortex-orchestrator
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
