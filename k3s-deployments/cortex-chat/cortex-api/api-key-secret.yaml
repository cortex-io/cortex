# Kubernetes Secret for Cortex API Key
# This secret should be created before deploying the cortex-api
# 
# To create the secret, run:
#   kubectl create secret generic cortex-api-key \
#     --from-literal=api-key=<your-secure-random-key> \
#     -n cortex
#
# To generate a secure random key, use:
#   openssl rand -base64 32
#
# Example:
#   kubectl create secret generic cortex-api-key \
#     --from-literal=api-key=$(openssl rand -base64 32) \
#     -n cortex
apiVersion: v1
kind: Secret
metadata:
  name: cortex-api-key
  namespace: cortex
type: Opaque
stringData:
  # Replace this with a secure random key generated using: openssl rand -base64 32
  # This is a placeholder - DO NOT use in production
  api-key: "CHANGE_ME_TO_A_SECURE_RANDOM_KEY"
