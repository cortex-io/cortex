nconst healthServer = http.createServer((req, res) =\u003e {\n  if (req.url === '/health') {\n    res.writeHead(200, { 'Content-Type': 'application/json' });\n    res.end(JSON.stringify({\n      status: 'healthy',\n      server: 'cortex-mcp-server',\n      mode: 'stdio-wrapper',\n      mcp_running: mcpProcess \u0026\u0026 !mcpProcess.killed\n    }));\n  } else if (req.url === '/metrics') {\n    res.writeHead(200, { 'Content-Type': 'text/plain' });\n    res.end('# Cortex MCP Server Metrics\\ncortex_mcp_up 1\\n');\n  } else {\n    res.writeHead(404);\n    res.end();\n  }\n});\n\nhealthServer.listen(HEALTH_PORT, '0.0.0.0', () =\u003e {\n  console.log(`[Health] HTTP server listening on port ${HEALTH_PORT}`);\n});\n\n// MCP query server (simple passthrough for now)\nconst mcpServer = http.createServer((req, res) =\u003e {\n  if (req.url === '/query' \u0026\u0026 req.method === 'POST') {\n    let body = '';\n    req.on('data', chunk =\u003e { body += chunk; });\n    req.on('end', () =\u003e {\n      res.writeHead(200, { 'Content-Type': 'application/json' });\n      res.end(JSON.stringify({\n        message: 'Cortex MCP Server - stdio mode',\n        note: 'Use stdio protocol to interact with MCP server'\n      }));\n    });\n  } else {\n    res.writeHead(404);\n    res.end();\n  }\n});\n\nmcpServer.listen(PORT, '0.0.0.0', () =\u003e {\n  console.log(`[MCP] HTTP wrapper listening on port ${PORT}`);\n  startMCPServer();\n});\n\nprocess.on('SIGTERM', () =\u003e {\n  console.log('[Wrapper] Received SIGTERM, shutting down...');\n  if (mcpProcess) mcpProcess.kill();\n  process.exit(0);\n});\nEOF\n\n# Start the HTTP wrapper\necho \"Starting HTTP wrapper...\"\nexec node /app/http-server.cjs\n"],"env":[{"name":"UNIFI_MCP_URL","valueFrom":{"configMapKeyRef":{"key":"UNIFI_MCP_URL","name":"cortex-mcp-config"}}},{"name":"PROXMOX_MCP_URL","valueFrom":{"configMapKeyRef":{"key":"PROXMOX_MCP_URL","name":"cortex-mcp-config"}}},{"name":"WAZUH_MCP_URL","valueFrom":{"configMapKeyRef":{"key":"WAZUH_MCP_URL","name":"cortex-mcp-config"}}},{"name":"WORKER_POOL_SIZE","valueFrom":{"configMapKeyRef":{"key":"WORKER_POOL_SIZE","name":"cortex-mcp-config"}}},{"name":"MAX_CONCURRENT_WORKERS","valueFrom":{"configMapKeyRef":{"key":"MAX_CONCURRENT_WORKERS","name":"cortex-mcp-config"}}},{"name":"WORKER_TIMEOUT_MINUTES","valueFrom":{"configMapKeyRef":{"key":"WORKER_TIMEOUT_MINUTES","name":"cortex-mcp-config"}}},{"name":"MOE_ENABLED","valueFrom":{"configMapKeyRef":{"key":"MOE_ENABLED","name":"cortex-mcp-config"}}},{"name":"MOE_STRATEGY","valueFrom":{"configMapKeyRef":{"key":"MOE_STRATEGY","name":"cortex-mcp-config"}}},{"name":"LOG_LEVEL","valueFrom":{"configMapKeyRef":{"key":"LOG_LEVEL","name":"cortex-mcp-config"}}},{"name":"LOG_FORMAT","valueFrom":{"configMapKeyRef":{"key":"LOG_FORMAT","name":"cortex-mcp-config"}}},{"name":"MCP_PORT","valueFrom":{"configMapKeyRef":{"key":"MCP_PORT","name":"cortex-mcp-config"}}},{"name":"HEALTH_PORT","valueFrom":{"configMapKeyRef":{"key":"HEALTH_PORT","name":"cortex-mcp-config"}}},{"name":"NODE_ENV","valueFrom":{"configMapKeyRef":{"key":"NODE_ENV","name":"cortex-mcp-config"}}}],"image":"node:18-alpine","imagePullPolicy":"IfNotPresent","livenessProbe":{"failureThreshold":3,"httpGet":{"path":"/health","port":"health"},"initialDelaySeconds":60,"periodSeconds":10,"timeoutSeconds":5},"name":"cortex-mcp-server","ports":[{"containerPort":3000,"name":"mcp","protocol":"TCP"},{"containerPort":8080,"name":"health","protocol":"TCP"}],"readinessProbe":{"failureThreshold":2,"httpGet":{"path":"/health","port":"health"},"initialDelaySeconds":30,"periodSeconds":5,"timeoutSeconds":3},"resources":{"limits":{"cpu":"1000m","memory":"1Gi"},"requests":{"cpu":"200m","memory":"256Mi"}},"volumeMounts":[{"mountPath":"/app","name":"workspace"},{"mountPath":"/app/coordination","name":"coordination"},{"mountPath":"/tmp","name":"tmp"}],"workingDir":"/app"}],"initContainers":[{"command":["sh","-c","set -e\necho \"Preparing Cortex MCP Server workspace...\"\n\n# Create directory structure\nmkdir -p /app/src/clients\nmkdir -p /app/src/worker-pool\nmkdir -p /app/src/masters\nmkdir -p /app/src/tools\nmkdir -p /app/config\nmkdir -p /app/coordination/masters\nmkdir -p /app/coordination/workers\nmkdir -p /app/coordination/tasks\n\n# Copy root files\necho \"Copying root files...\"\ncp /source/package.json /app/\ncp /source/Dockerfile /app/\n\n# Copy src files to correct locations\necho \"Copying src files...\"\ncp /source/index.js /app/src/\ncp /source/moe-router.js /app/src/\n\n# Copy client files\necho \"Copying client files...\"\ncp /source/k8s.js /app/src/clients/\ncp /source/proxmox.js /app/src/clients/\ncp /source/unifi.js /app/src/clients/\ncp /source/wazuh.js /app/src/clients/\n\n# Copy tool files\necho \"Copying tool files...\"\ncp /source/query.js /app/src/tools/\ncp /source/status.js /app/src/tools/\n\n# Copy worker-pool files\necho \"Copying worker-pool files...\"\ncp /source/coordinator.js /app/src/worker-pool/\ncp /source/monitor.js /app/src/worker-pool/\ncp /source/spawner.js /app/src/worker-pool/\n\n# List what we have\necho \"Workspace contents:\"\nls -la /app/\necho \"\"\necho \"Source structure:\"\nls -laR /app/src/\n\necho \"Workspace preparation complete!\"\n"],"image":"busybox:latest","name":"prepare-workspace","volumeMounts":[{"mountPath":"/app","name":"workspace"},{"mountPath":"/source","name":"source"}]}],"serviceAccountName":"cortex-mcp-server","volumes":[{"emptyDir":{},"name":"workspace"},{"configMap":{"name":"cortex-mcp-src"},"name":"source"},{"emptyDir":{},"name":"coordination"},{"emptyDir":{},"name":"tmp"}]}}}}
    creationTimestamp: "2025-12-24T23:00:49Z"
    generation: 6
    labels:
      app: cortex-mcp-server
      component: mcp-gateway
      version: v1
    name: cortex-mcp-server
    namespace: cortex-system
    resourceVersion: "24156524"
    uid: 2a02e397-a9da-461a-b5ff-2aeca839929b
  spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app: cortex-mcp-server
    strategy:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
      type: RollingUpdate
    template:
      metadata:
        annotations:
          prometheus.io/path: /metrics
          prometheus.io/port: "8080"
          prometheus.io/scrape: "true"
        creationTimestamp: null
        labels:
          app: cortex-mcp-server
          component: mcp-gateway
          version: v1
      spec:
        containers:
        - command:
          - sh
          - -c
          - |
            set -e
            echo "Starting Cortex MCP Server..."

            cd /app

            # Install dependencies
            echo "Installing dependencies..."
            npm install --production

            # Create required directories if they don't exist
            mkdir -p /app/coordination/masters
            mkdir -p /app/coordination/workers
            mkdir -p /app/coordination/tasks

            # Create a simple HTTP wrapper and health endpoint
            cat > /app/http-server.cjs << 'EOF'
            const http = require('http');
            const { spawn } = require('child_process');

            const PORT = parseInt(process.env.MCP_PORT || '3000');
            const HEALTH_PORT = parseInt(process.env.HEALTH_PORT || '8080');

            // Start MCP stdio server process
            let mcpProcess = null;

            function startMCPServer() {
              mcpProcess = spawn('node', ['src/index.js'], {
                cwd: '/app'
              });

              mcpProcess.stdout.on('data', (data) => {
                console.log('[MCP stdout]', data.toString());
              });

              mcpProcess.stderr.on('data', (data) => {
                console.error('[MCP stderr]', data.toString());
              });

              mcpProcess.on('exit', (code) => {
                console.error(`[MCP] Process exited with code ${code}`);
                // Restart if it crashes
                setTimeout(startMCPServer, 1000);
              });

              // Keep stdin open
              setInterval(() => {
                try {
                  mcpProcess.stdin.write('\n');
                } catch (err) {
                  // Ignore
                }
              }, 30000);
            }

            // Health check server
            const healthServer = http.createServer((req, res) => {
              if (req.url === '/health') {
                res.writeHead(200, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({
                  status: 'healthy',
                  server: 'cortex-mcp-server',
                  mode: 'stdio-wrapper',
                  mcp_running: mcpProcess && !mcpProcess.killed
                }));
              } else if (req.url === '/metrics') {
                res.writeHead(200, { 'Content-Type': 'text/plain' });
                res.end('# Cortex MCP Server Metrics\ncortex_mcp_up 1\n');
              } else {
                res.writeHead(404);
                res.end();
              }
            });

            healthServer.listen(HEALTH_PORT, '0.0.0.0', () => {
              console.log(`[Health] HTTP server listening on port ${HEALTH_PORT}`);
            });

            // MCP query server (simple passthrough for now)
            const mcpServer = http.createServer((req, res) => {
              if (req.url === '/query' && req.method === 'POST') {
                let body = '';
                req.on('data', chunk => { body += chunk; });
                req.on('end', () => {
                  res.writeHead(200, { 'Content-Type': 'application/json' });
                  res.end(JSON.stringify({
                    message: 'Cortex MCP Server - stdio mode',
                    note: 'Use stdio protocol to interact with MCP server'
                  }));
                });
              } else {
                res.writeHead(404);
                res.end();
              }
            });

            mcpServer.listen(PORT, '0.0.0.0', () => {
              console.log(`[MCP] HTTP wrapper listening on port ${PORT}`);
              startMCPServer();
            });

            process.on('SIGTERM', () => {
              console.log('[Wrapper] Received SIGTERM, shutting down...');
              if (mcpProcess) mcpProcess.kill();
              process.exit(0);
            });
            EOF

            # Start the HTTP wrapper
            echo "Starting HTTP wrapper..."
