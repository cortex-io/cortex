  spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app: documentation-master
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        annotations:
          kubectl.kubernetes.io/restartedAt: "2025-12-27T19:26:22-06:00"
        creationTimestamp: null
        labels:
          app: documentation-master
      spec:
        containers:
        - command:
          - /bin/sh
          - -c
          - |
            # Install dependencies
            apk add --no-cache bash curl jq wget

            # Copy master scripts from ConfigMap volume
            mkdir -p /app/lib /app/workers /app/config

            # Start the master process
            echo "Documentation Master starting..."
            echo "Knowledge base: /data/kb"
            echo "Cache: /data/cache"

            # Simple HTTP server for queries
            while true; do
              echo "Documentation Master ready on port 8080"
              nc -l -p 8080 -e /bin/sh -c 'echo -e "HTTP/1.1 200 OK\nContent-Type: application/json\n\n{\"status\":\"ready\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"'
            done
          env:
          - name: KB_PATH
            value: /data/kb
          - name: CACHE_PATH
            value: /data/cache
          image: alpine:latest
          imagePullPolicy: Always
          name: doc-master
          ports:
          - containerPort: 8080
            name: http
            protocol: TCP
          - containerPort: 9090
            name: metrics
            protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /data/kb
            name: kb-storage
          - mountPath: /data/cache
            name: cache-storage
          - mountPath: /app/config
            name: config
        dnsPolicy: ClusterFirst
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 30
        volumes:
        - name: kb-storage
          persistentVolumeClaim:
            claimName: documentation-master-kb
        - name: cache-storage
          persistentVolumeClaim:
            claimName: documentation-master-cache
        - configMap:
            defaultMode: 420
            name: documentation-master-config
          name: config
