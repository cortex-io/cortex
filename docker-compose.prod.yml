version: '3.8'

# Cortex Docker Compose - Production Override
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  cortex:
    # Use pre-built image from registry
    image: ${CORTEX_IMAGE:-ghcr.io/ry-ops/cortex:latest}

    # Production environment
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info

    # Production restart policy
    restart: always

    # Stricter health check
    healthcheck:
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s

    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

      # Restart policy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # Production logging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

    # Security options
    security_opt:
      - no-new-privileges:true

    # Read-only root filesystem (with exceptions)
    read_only: true
    tmpfs:
      - /tmp
      - /app/coordination/tmp
